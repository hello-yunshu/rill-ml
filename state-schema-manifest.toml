# State schema stability manifest.
#
# This file is the single source of truth for which serde model state types
# are covered by the 1.x state-freeze contract (Stable state schema) and
# which remain in the Preview group (no cross-version fixture coverage).
#
# `scripts/check_state_fixture_coverage.py` reads this file and validates:
#   - Every Stable type has a v0.13.0 fixture.
#   - Every Stable type has a v1 fixture.
#   - Every Stable type implements `ValidateState`.
#   - Fixture files exist on disk.
#   - No duplicate entries in either group.
#   - No overlap between Stable and Preview groups.
#
# Rust API Stable does NOT imply serde state schema Stable. A type can have
# a Stable public API but a Preview state schema (e.g. drift detectors).
# Preview types can still be serialized, but their state schema is not
# guaranteed to be compatible across 1.x versions.

# ─────────────────────────────────────────────────────────────────────────────
# Stable state schema types (26 types with full v0.13.0 + v1 fixture coverage)
# ─────────────────────────────────────────────────────────────────────────────

