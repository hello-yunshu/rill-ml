# RillML 1.0 release plan.
#
# Single machine-readable source of truth for which crates belong to the
# Stable group (advance to 1.0.0-rc.x and later 1.0.0) and which remain in
# the Preview group (stay at 0.x). scripts/sync_version.py reads this file
# to decide which version to apply to each workspace member.

[stable]
version = "1.0.0-rc.2"
crates = [
  "rill-handler-api",
  "rill-runtime-protocol",
  "rill-ml",
  "rill-runtime",
]

[preview]
version = "0.13.0"
crates = [
  "rill-ml-python",
  "rill-ml-wasm",
  "rill-ml-tokio",
  "rill-ml-arrow",
  "rill-ml-polars",
  "rillml-inspect",
]
