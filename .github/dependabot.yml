version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      runtime-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # Major version bumps should be reviewed individually.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # libc 0.2.190+ drops the riscv64-musl REG_* constants
      # (REG_PC/REG_SP/REG_S0/...), so the riscv64gc-unknown-linux-musl
      # runtime build fails. Hold patch bumps until upstream restores them;
      # lifting this ignore requires a green riscv64 musl build in the same PR.
      - dependency-name: "libc"
        update-types: ["version-update:semver-patch"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Workflows intentionally use readable action refs rather than fixed
    # 40-character commit SHAs. Dependabot keeps those named refs current.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
