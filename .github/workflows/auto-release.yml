name: Auto Release

on:
  workflow_run:
    workflows: [CI / Release]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  tag-and-dispatch:
    name: Tag and dispatch release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # Must comfortably exceed the Cross-Platform Stable-gate wait (capped at
    # 45m inside the job); Docker/QEMU cross-arch runs can take 1-3h, and a
    # timeout here would silently cancel the auto-release before it dispatches.
    timeout-minutes: 60
    steps:
      - name: Confirm the successful CI commit is still main
        id: freshness
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "Skipping stale CI result for $EXPECTED_SHA; main is now $current_sha"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.freshness.outputs.current == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify cross-platform Stable gates passed on the same SHA
        # The release must be bound to the SAME commit's Required Gates, not
        # just pipeline.yml. The Cross-Platform Verification workflow (native
        # runners, direct QEMU, VMs, and Docker only where valuable) runs in
        # parallel; wait for it to finish on this exact SHA and require success.
        # If it never ran for this SHA (doc-only push), proceed — no
        # cross-platform-relevant files changed.
        if: steps.freshness.outputs.current == 'true'
        id: crossplatform
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))  # 45 min cap
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh run list --workflow "Cross-Platform Verification" \
              --branch main --json headSha,status,conclusion --limit 100)"
            matched="$(jq --arg sha "$TARGET_SHA" \
              '[.[] | select(.headSha == $sha)]' <<<"$runs")"
            count="$(jq 'length' <<<"$matched")"
            if [ "$count" -eq 0 ]; then
              echo "No Cross-Platform run for $TARGET_SHA (doc-only or no relevant paths) — proceeding."
              echo "ran=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$matched")"
            if [ "$pending" -gt 0 ]; then
              echo "Cross-Platform run for $TARGET_SHA still in progress ($pending pending)…"
              sleep 30
              continue
            fi
            failed="$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length' <<<"$matched")"
            if [ "$failed" -gt 0 ]; then
              echo "Cross-Platform Stable gates FAILED on $TARGET_SHA — refusing to release." >&2
              jq -c '.[] | {conclusion, htmlUrl}' <<<"$matched" >&2
              exit 1
            fi
            echo "Cross-Platform Stable gates passed on $TARGET_SHA."
            echo "ran=true" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "Timed out waiting for Cross-Platform gates on $TARGET_SHA — refusing to release." >&2
          exit 1

      # ────────────────────────────────────────────────────────────
      # Release admission: Security Audit must PASS on the same SHA.
      # CodeQL + RustSec are part of the required gates; a release
      # is prohibited if either is missing, queued, in_progress, failed,
      # cancelled, or timed out on this exact commit — not merely "usually
      # runs".
      # ────────────────────────────────────────────────────────────
      - name: Verify Security Audit passed on the same SHA
        if: steps.freshness.outputs.current == 'true'
        id: security
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))  # 30 min cap
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh run list --workflow "Security audit" \
              --branch main --json headSha,status,conclusion --limit 100)"
            matched="$(jq --arg sha "$TARGET_SHA" \
              '[.[] | select(.headSha == $sha)]' <<<"$runs")"
            failed="$(jq '[.[] | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))] | length' <<<"$matched")"
            if [ "$failed" -gt 0 ]; then
              echo "Security Audit FAILED on $TARGET_SHA — refusing to release." >&2
              jq -c '.[] | {status, conclusion, htmlUrl}' <<<"$matched" >&2
              exit 1
            fi
            passed="$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$matched")"
            if [ "$passed" -gt 0 ]; then
              echo "Security Audit passed on $TARGET_SHA (CodeQL + RustSec)."
              exit 0
            fi
            echo "Security Audit for $TARGET_SHA not yet successful ($passed passed, $failed failed) — waiting…"
            sleep 30
          done
          echo "Timed out waiting for Security Audit on $TARGET_SHA — refusing to release." >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        if: steps.freshness.outputs.current == 'true'

      - name: Validate the release version
        if: steps.freshness.outputs.current == 'true'
        id: version
        run: python3 scripts/release_version.py --github-output "$GITHUB_OUTPUT"

      - name: Create tag or select a safe retry
        if: steps.freshness.outputs.current == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh run list --workflow pipeline.yml --limit 50 --json displayTitle,status,conclusion)"
          active="$(jq --arg title "Release $TAG" '[.[] | select(.displayTitle == $title and .status != "completed")] | length' <<<"$runs")"
          successful="$(jq --arg title "Release $TAG" '[.[] | select(.displayTitle == $title and .conclusion == "success")] | length' <<<"$runs")"

          tag_exists=false
          tag_sha=""
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_exists=true
            tag_sha="$(git rev-list -n 1 "$TAG")"
          fi

          policy_args=(
            "--target-sha" "$TARGET_SHA"
            "--github-output" "$GITHUB_OUTPUT"
          )
          if [ "$tag_exists" = "true" ]; then
            policy_args+=("--tag-exists" "--tag-sha" "$tag_sha")
          fi
          if [ "$successful" -gt 0 ]; then
            policy_args+=("--has-successful-release")
          fi
          if [ "$active" -gt 0 ]; then
            policy_args+=("--has-active-release")
          fi

          # The policy helper decides dispatch/skip/fail and writes
          # ``dispatch=<bool>`` to ``$GITHUB_OUTPUT``. Its logic is unit-tested
          # in ``scripts/tests/test_release_tag_policy.py``; this shell block
          # only gathers the inputs and performs the tag creation when allowed.
          python3 scripts/release_tag_policy.py "${policy_args[@]}"
          decision_exit=$?
          if [ "$decision_exit" -ne 0 ]; then
            exit "$decision_exit"
          fi

          if [ "$tag_exists" = "false" ]; then
            # Match stable and prerelease SemVer tags (v1.0.0, v1.0.0-rc.1, ...).
            latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -n "$latest_tag" ]; then
              python3 scripts/release_version_compare.py "$VERSION" "${latest_tag#v}"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at $TARGET_SHA"
          fi
          # Release tags are IMMUTABLE: if the tag already exists it is either
          # a same-SHA safe retry (policy -> dispatch) or a SHA mismatch (policy
          # -> hard fail). There is deliberately NO branch here that force-moves
          # an existing tag (`git tag --force` / `git push --force` is forbidden).
          # When the tag exists at the same SHA, the policy helper already set
          # dispatch=true, so the dispatch step below re-runs the Release.

      - name: Dispatch Release on the version tag
        if: steps.release.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run pipeline.yml --ref main -f tag="$TAG"
