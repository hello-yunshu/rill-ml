name: Security audit

on:
  push:
    branches: [main, master, 'release/**']
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "handlers/**"
      - "scripts/**"
      - "models/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "handlers/**"
      - "scripts/**"
      - "models/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4 # v4
        with:
          # Rust covers src/, crates/, handlers/. Python covers scripts/
          # and crates/rill-ml-python/. `actions` covers the workflows.
          languages: rust, python, actions
      - uses: github/codeql-action/analyze@v4 # v4

  audit:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      # RustSec audit-check, pinned to the node24 update commit (858dc40, PR #48).
      # The v2.0.0 tag still targets Node 20 and triggers the deprecation warning.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
