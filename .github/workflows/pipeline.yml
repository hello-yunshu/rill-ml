name: CI / Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0}', inputs.tag) || 'CI' }}

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v0.7.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  PUBLISHER_KEY_ID: rillml-examples-2026-001
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RILL_PUBLIC_KEY_HEX: 29fd1fc2f22bd7e405aec167ff0a0d8de791f011c415075d4c5f9f64fd93fc2e

# ─────────────────────────────────────────────────────────────────────────────
# CI jobs — run on push (branches) and pull_request, never on workflow_dispatch.
# Release jobs — run only on workflow_dispatch (auto-release dispatches them
# after CI succeeds; the tag-push trigger is intentionally omitted to avoid
# duplicate runs).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  fmt:
    name: cargo fmt
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2 # v2
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --exclude rill-ml-python -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Phase 4: `windows-11-arm` runs the full workspace suite natively on
        # the GitHub-hosted Windows ARM64 runner (aarch64-pc-windows-msvc).
        # Windows native behaviour cannot be validated in Docker (no Windows
        # container support on the Linux Docker hosts), so the native ARM64
        # runner is the accepted verification path.
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2 # v2
      - name: cargo check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: cargo test workspace
        run: cargo test --locked --workspace --all-targets --all-features --exclude rill-ml-python
      - name: cargo test docs
        run: cargo test --locked --workspace --doc --all-features --exclude rill-ml-python

  windows-arm64:
    name: Windows ARM64 (aarch64) native
    # Phase 4: Runtime smoke + signed-WASM Handler invoke on the native
    # Windows ARM64 hosted runner (`windows-11-arm`, target
    # aarch64-pc-windows-msvc). The `test` matrix above already runs the
    # full workspace suite on this runner; this job covers the two pieces
    # the generic suite cannot exercise without committed WASM fixtures:
    #   - Runtime `--help` / `serve --help` smoke
    #   - WASM echo Handler build + real invoke through wasmtime
    # Docker cannot validate Windows native behaviour (no Windows container
    # support on the Linux Docker hosts), so the native runner is the
    # accepted verification path (see PLATFORM_SUPPORT.md).
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2 # v2
      - name: Install wasm-tools
        # Exact release-tool version shared with the release packaging job.
        run: cargo install wasm-tools --locked --version "1.254.0"
      - name: Record resolved wasm-tools version
        run: wasm-tools --version
      - name: Runtime --help smoke (aarch64)
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p rill-runtime --bin rill-runtime --features wasm -- --help
          output=$(cargo run --locked -p rill-runtime --bin rill-runtime --features wasm -- serve --help)
          echo "$output" | grep -- '--handler'
          echo "$output" | grep -- '--model-trust-key'
      - name: Build echo handler component
        shell: bash
        run: |
          set -euo pipefail
          cd handlers/echo-handler
          cargo build --locked --release --target wasm32-unknown-unknown
          mkdir -p ../../target
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/echo-handler.wasm \
            -o ../../target/echo-handler.wasm
      - name: Run WASM handler integration tests (aarch64)
        env:
          ECHO_HANDLER_WASM: ${{ github.workspace }}/target/echo-handler.wasm
        run: cargo test --locked -p rill-runtime --features wasm --test wasm_handler -- --include-ignored
      - name: Run runtime process integration tests (aarch64)
        env:
          ECHO_HANDLER_WASM: ${{ github.workspace }}/target/echo-handler.wasm
        run: cargo test --locked -p rill-runtime --features wasm --test runtime_process

  msrv:
    name: MSRV (1.94) lib check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2 # v2
      - name: cargo +1.94 check rill-ml --lib
        run: cargo +1.94.0 check --locked --lib
      - name: cargo +1.94 check rill-ml --lib --features serde
        run: cargo +1.94.0 check --locked --lib --features serde
      - name: cargo +1.94 check rill-handler-api
        run: cargo +1.94.0 check --locked -p rill-handler-api
      - name: cargo +1.94 check rill-runtime-protocol
        run: cargo +1.94.0 check --locked -p rill-runtime-protocol
      - name: cargo +1.94 check rill-runtime (default features)
        run: cargo +1.94.0 check --locked -p rill-runtime
      - name: cargo +1.94 check rill-runtime (wasm feature)
        run: cargo +1.94.0 check --locked -p rill-runtime --features wasm

  doc:
    name: cargo doc
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # v2
      - name: cargo doc --features serde --no-deps
        run: cargo doc --locked --features serde --no-deps

  public-api:
    name: public API baseline
    # 1.0 freeze: `cargo-public-api` baseline is used for precise drift
    # review — it catches unexpected API additions/removals that require
    # human judgement. `cargo-semver-checks` (see the `semver-checks`
    # job below) is the authoritative tool for judging SemVer
    # compatibility. The two tools are complementary: this job produces
    # the human-readable diff evidence, the `semver-checks` job enforces
    # the compatibility contract.
    #
    # `cargo-public-api` requires the nightly toolchain to build the
    # rustdoc JSON that backs the listing.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Install Rust (nightly)
        # cargo-public-api uses the nightly toolchain to build rustdoc JSON.
        # The baseline files were generated against a recent nightly, so we
        # use `nightly` (latest) here to stay in sync. The semver-checks job
        # pins a specific nightly because cargo-semver-checks has tighter
        # compatibility constraints with the rustdoc JSON format version.
        uses: dtolnay/rust-toolchain@nightly
      - name: Record resolved nightly toolchain version
        run: rustc --version
      - name: Install cargo-public-api
        # Exact release-tool version; bump deliberately with the reviewed API
        # baselines when the generator changes.
        run: cargo install cargo-public-api --locked --version "0.52.0"
      - name: Record resolved cargo-public-api version
        run: cargo public-api --version
      - uses: Swatinem/rust-cache@v2 # v2
      - name: Verify Stable-crate public API baseline
        run: python3 scripts/generate_api_baseline.py --verify

  semver-checks:
    name: cargo semver-checks
    # 1.0 freeze: the authoritative SemVer compatibility gate. Unlike
    # `cargo-public-api` (which produces a human-readable text diff for
    # review), `cargo-semver-checks` performs a rigorous lints-based
    # analysis that catches breaking changes that simple text comparison
    # would miss (e.g. tightening trait bounds, deleting enum variants,
    # changing function signatures, removing public fields).
    #
    # The baseline is the most recently published Stable release
    # (1.2.0) on crates.io. The four Stable crates are checked
    # individually:
    #   rill-ml, rill-runtime-protocol, rill-handler-api, rill-runtime
    #
    # `cargo-semver-checks` requires the nightly toolchain to build the
    # rustdoc JSON that backs the analysis.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Install Rust (nightly-2026-07-17)
        # Pinned nightly version. cargo-semver-checks depends on
        # trustfall-rustdoc-adapter to parse rustdoc JSON, and newer
        # nightly toolchains can introduce breaking changes (e.g. removed
        # built-in traits like RefUnwindSafe/UnwindSafe) that cause the
        # adapter to panic. v0.49.0 was released against nightly-2026-07-17.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-17
      - name: Record resolved nightly toolchain version
        run: rustc --version
      - name: Install cargo-semver-checks
        # Exact release-tool version; the nightly/tool adapter pair is reviewed
        # together because rustdoc JSON changes can invalidate the gate.
        # v0.49+ is required because the workspace uses ``resolver = "3"``
        # (Edition 2024); older versions like 0.35 fail to parse the
        # ``Cargo.toml`` with "unknown variant `3`".
        run: cargo install cargo-semver-checks --locked --version "0.49.0"
      - name: Record resolved cargo-semver-checks version
        run: cargo semver-checks --version
      - uses: Swatinem/rust-cache@v2 # v2
      # 1.5.1 admission: the immediately previous Stable release 1.5.0 is
      # authoritative. Historical 1.3.0 and 1.0.0 checks remain sanity gates.
      - name: Run semver-checks for rill-ml (baseline 1.5.0)
        run: cargo semver-checks --package rill-ml --baseline-version 1.5.0 --all-features
      - name: Run semver-checks for rill-handler-api (baseline 1.5.0)
        run: cargo semver-checks --package rill-handler-api --baseline-version 1.5.0
      - name: Run semver-checks for rill-runtime-protocol (baseline 1.5.0)
        run: cargo semver-checks --package rill-runtime-protocol --baseline-version 1.5.0
      - name: Run semver-checks for rill-runtime (baseline 1.5.0)
        run: cargo semver-checks --package rill-runtime --baseline-version 1.5.0
      - name: Run historical semver sanity for rill-ml (baseline 1.3.0)
        run: cargo semver-checks --package rill-ml --baseline-version 1.3.0 --all-features
      - name: Run historical semver sanity for rill-handler-api (baseline 1.3.0)
        run: cargo semver-checks --package rill-handler-api --baseline-version 1.3.0
      - name: Run historical semver sanity for rill-runtime-protocol (baseline 1.3.0)
        run: cargo semver-checks --package rill-runtime-protocol --baseline-version 1.3.0
      - name: Run historical semver sanity for rill-runtime (baseline 1.3.0)
        run: cargo semver-checks --package rill-runtime --baseline-version 1.3.0

  install-smoke:
    name: cargo install default-feature smoke
    # 1.0 freeze: verify that `cargo install rill-runtime` (the documented
    # user-facing install command) succeeds with default features and
    # produces a working binary. This catches regressions where a default
    # feature change breaks the documented install path even when
    # `cargo check` passes.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # v2
      - name: cargo install rill-runtime (default features)
        run: cargo install --path crates/rill-runtime --root /tmp/rill-install --locked
      - name: Verify rill-runtime --help works
        run: /tmp/rill-install/bin/rill-runtime --help
      - name: Verify rill-runtime serve --help advertises --handler and --model-trust-key
        run: |
          set -euo pipefail
          output=$(/tmp/rill-install/bin/rill-runtime serve --help)
          echo "$output" | grep -- '--handler'
          echo "$output" | grep -- '--model-trust-key'

  release-index-helpers:
    name: release-index helper tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Verify model/runtime index update behavior
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run product-surface drift gate
        run: python3 scripts/check_product_surface.py --json
      - name: Run action-ref gate
        run: python3 scripts/check_action_pins.py --json
      - name: Run offline conformance gate
        run: python3 conformance/run.py --mode offline --json
      - name: Validate consumer adoption example
        run: python3 scripts/validate_consumer_adoption.py schemas/examples/rill-consumer-adoption-example.json --json

  state-schema-coverage:
    name: state schema fixture coverage gate
    # 1.0 freeze: validates that every Stable state schema type listed in
    # ``state-schema-manifest.toml`` has full cross-version fixture coverage
    # (v0.13.0 + v1) and implements the declared validation mode
    # (ValidateState / custom Deserialize / derive). This closes the gap
    # between the STABILITY.md state-freeze contract and the actual fixture
    # coverage on disk. Preview types are explicitly listed as not covered.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - name: Validate Stable state schema fixture coverage
        run: python3 scripts/check_state_fixture_coverage.py

  wasm-build:
    name: WASM bindings build + test (publishable npm package)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2 # v2
      - run: cargo check --locked -p rill-ml-wasm --target wasm32-unknown-unknown
      # Canonical gate: builds the publishable npm layout (pkg/ web ESM +
      # pkg-node/ Node CJS), fixes up the wasm-pack .gitignore/.npmignore
      # precedence so the artifacts remain packable, and runs the wasm-bindgen
      # test suite under Node. The Docker-first canonical gate runs the same
      # script inside a pinned container (see cross-platform.yml -> wasm-bindings-gate
      # and scripts/docker-wasm-build.sh).
      - name: wasm-pack build + test (both targets)
        run: bash scripts/wasm-pack-build.sh
      - name: Node smoke test (pkg-node consumer path)
        run: cd crates/rill-ml-wasm && node tests/node-smoke.mjs
      - name: Verify publishable tarball contains both builds
        run: |
          set -euo pipefail
          cd crates/rill-ml-wasm
          npm pack --dry-run --json > /tmp/pack.json
          python3 - <<'PY'
          import json
          with open("/tmp/pack.json") as f:
              data = json.load(f)
          files = [e["path"] for e in data[0]["files"]]
          for expected in ("pkg/rill_ml_wasm.js", "pkg-node/rill_ml_wasm.js",
                           "index.d.ts", "README.md"):
              assert any(f == expected for f in files), f"missing {expected} in tarball"
          print("tarball contains browser + node builds and declarations")
          PY

  wasm-handler:
    name: WASM handler component build + test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2 # v2
      - name: Install wasm-tools
        # Exact release-tool version shared with the release packaging job.
        run: cargo install wasm-tools --locked --version "1.254.0"
      - name: Record resolved wasm-tools version
        run: wasm-tools --version
      - name: Build echo handler component
        run: |
          cd handlers/echo-handler
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../../target
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/echo-handler.wasm \
            -o ../../target/echo-handler.wasm
      - name: Build malicious test handler component
        run: |
          cd handlers/test-malicious-handler
          cargo build --release --target wasm32-unknown-unknown
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/test-malicious-handler.wasm \
            -o ../../target/test-malicious-handler.wasm
      - name: Build metadata-loop test handler component
        run: |
          cd handlers/test-metadata-loop-handler
          cargo build --release --target wasm32-unknown-unknown
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/test-metadata-loop-handler.wasm \
            -o ../../target/test-metadata-loop-handler.wasm
      - name: Build Stateful Handler ABI v2 test component
        run: |
          cd handlers/test-stateful-handler-v2
          cargo build --locked --release --target wasm32-unknown-unknown
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/test-stateful-handler-v2.wasm \
            -o ../../target/test-stateful-handler-v2.wasm
      - name: Run WASM handler integration tests
        env:
          ECHO_HANDLER_WASM: ${{ github.workspace }}/target/echo-handler.wasm
          MALICIOUS_HANDLER_WASM: ${{ github.workspace }}/target/test-malicious-handler.wasm
          METADATA_LOOP_HANDLER_WASM: ${{ github.workspace }}/target/test-metadata-loop-handler.wasm
        run: cargo test --locked -p rill-runtime --features wasm --test wasm_handler -- --include-ignored
      - name: Run runtime process integration tests (with WASM)
        env:
          ECHO_HANDLER_WASM: ${{ github.workspace }}/target/echo-handler.wasm
        run: cargo test --locked -p rill-runtime --features wasm --test runtime_process
      - name: Run Stateful Handler ABI v2 integration tests
        env:
          RILL_RUN_WASM_FIXTURE_TESTS: "1"
          STATEFUL_HANDLER_V2_WASM: ${{ github.workspace }}/target/test-stateful-handler-v2.wasm
        run: cargo test --locked -p rill-runtime --features wasm --test stateful_handler_v2
      - name: Run internal WASM ticker lifecycle tests
        # Fifth-stage 5-A-01/5-A-02: the previous CI flow built the
        # WASM fixtures but only ran the *integration* tests
        # (`--test wasm_handler` / `--test runtime_process`). The
        # internal `#[cfg(test)] mod tests` inside `handler/wasm.rs`
        # — which directly observe the test-only `ACTIVE_EPOCH_TICKERS`
        # counter — were silently skipped because they live behind
        # `--lib` and rely on fixture env vars that the integration
        # tests do not set for them.
        #
        # `RILL_RUN_WASM_FIXTURE_TESTS=1` makes fixture absence a hard
        # failure: if the upstream fixture-build step regressed and
        # produced no `.wasm`, the lifecycle tests panic instead of
        # printing "skipping" and returning success.
        #
        # `-- --exact --nocapture` ensures each lifecycle test name
        # appears verbatim in the CI log so the audit report can cite
        # the workflow run ID + step + test name as evidence.
        env:
          RILL_RUN_WASM_FIXTURE_TESTS: "1"
          ECHO_HANDLER_WASM: ${{ github.workspace }}/target/echo-handler.wasm
          MALICIOUS_HANDLER_WASM: ${{ github.workspace }}/target/test-malicious-handler.wasm
          METADATA_LOOP_HANDLER_WASM: ${{ github.workspace }}/target/test-metadata-loop-handler.wasm
        run: |
          cargo test --locked \
            -p rill-runtime \
            --features wasm \
            --lib \
            handler::wasm::tests::normal_handler_drop_restores_active_ticker_count \
            -- --exact --nocapture

          cargo test --locked \
            -p rill-runtime \
            --features wasm \
            --lib \
            handler::wasm::tests::metadata_loop_failure_restores_active_ticker_count \
            -- --exact --nocapture

          cargo test --locked \
            -p rill-runtime \
            --features wasm \
            --lib \
            handler::wasm::tests::ticker_probe_is_available_to_internal_tests \
            -- --exact --nocapture
      - name: Verify ticker probe is not externally accessible
        # Sixth-stage 6-A-01: the fifth-stage rustdoc grep check only
        # inspects the rendered rustdoc.  Because `#[doc(hidden)] pub`
        # items are not rendered, that grep cannot detect a regression
        # where the probe is re-exposed as `#[doc(hidden)] pub fn
        # active_epoch_ticker_count()`.  This step takes the stricter
        # "external crate" view: a temporary crate that depends on
        # `rill-runtime` via path tries to `use` the probe; the check
        # passes only if that crate FAILS to compile.  A companion
        # smoke crate proves legitimate public API still compiles, so a
        # broken dependency configuration cannot be misread as "probe
        # invisible".
        run: python3 scripts/check_runtime_public_api.py
      - name: rendered-doc smoke check
        # Auxiliary check: confirm the test probe does not appear in the
        # rendered rustdoc.  This is NOT the primary public-API proof
        # (the compile-fail check above is) — it only catches probes
        # that are both `pub` and not `#[doc(hidden)]`.
        run: |
          set -euo pipefail
          cargo doc --locked \
            -p rill-runtime \
            --features wasm \
            --no-deps
          if grep -R -E \
            "active_epoch_ticker_count|ACTIVE_EPOCH_TICKERS" \
            target/doc/rill_runtime; then
            echo "::error::ticker lifecycle test probe leaked into rill-runtime public docs"
            exit 1
          fi
          echo "ticker probe absent from rill-runtime public rustdoc"
      - name: WIT ABI v1 consistency check
        # 1.0 freeze: verify that the four independent declarations of the
        # WIT ABI version agree, and that the normalised WIT source hash
        # matches the frozen value. This catches accidental WIT edits that
        # would silently break handler compatibility without a major bump.
        run: python3 scripts/check_wit_abi.py
      - name: Run prebuilt WIT v1 component compatibility tests
        # 1.0 freeze: verify the current runtime can load a prebuilt
        # component compiled from the v0.13.0 tag using the frozen WIT v1
        # ABI. The fixture (tests/fixtures/handler-v1-component.wasm) is
        # committed and never rebuilt by CI.
        run: cargo test --locked -p rill-runtime --features wasm --test wit_v1_component -- --include-ignored

  python-build:
    name: Python bindings build + pytest
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # v2
      - name: Build and test Python bindings
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # Install the Python build toolchain.
          # ``requirements-dev.txt`` is the source of truth for the
          # maturin and pytest exact versions used by CI and release.
          pip install -r scripts/requirements-dev.txt
          # Record the actually resolved versions for traceability.
          maturin --version
          pytest --version
          cd crates/rill-ml-python
          maturin develop --release
          pytest tests/ -v

  ffi-build:
    name: C FFI build + C ABI smoke
    # Phase 6a/6b: the stable C FFI crate (rill-ml-ffi) is part of the
    # workspace, so the `test` matrix already compiles and runs
    # tests/ffi_abi.rs on every OS. This job additionally proves the
    # external C consumer path: it compiles and links
    # crates/rill-ml-ffi/c_examples/basic.c against include/rill_ml.h and
    # the built cdylib, then executes it. Docker/QEMU and native
    # Android/iOS artifact gates live in cross-platform.yml.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # v2
      - name: cargo test rill-ml-ffi (opaque-handle ABI)
        run: cargo test --locked -p rill-ml-ffi
      - name: Compile + run C smoke test (rill_ml.h ABI)
        run: bash scripts/ffi-c-smoke.sh

  # ─────────────────────────────────────────────────────────────────────────
  # Release jobs — only on workflow_dispatch.
  # Auto Release dispatches this workflow after CI passes; the tag-push
  # trigger is intentionally omitted so retries are idempotent.
  # ─────────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────────────────────────
  # release-admission — the FINAL authority for every release, including
  # manual workflow_dispatch (which a human can trigger directly and thus
  # bypass auto-release.yml). It verifies, on the EXACT tag commit SHA, that
  # the push CI, Cross-Platform Verification and Security audit all passed
  # (any missing/queued/in_progress/failure/cancelled/timed_out is a HARD
  # FAIL), that no successful Release exists for the tag (successful release
  # assets are immutable), and that no Release is already in flight.
  # package-check `needs` this job, so the whole release tree cannot bypass it.
  # ────────────────────────────────────────────────────────────────────────────────────────────
  release-admission:
    name: Release admission (same-SHA gates)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve the release tag commit SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_sha="$(git rev-parse "$TAG^{commit}")"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - name: Run release admission (CI / Cross-Platform / Security same-SHA)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          TAG_SHA: ${{ steps.resolve.outputs.tag_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_admission.py \
            --tag "$TAG" \
            --tag-sha "$TAG_SHA" \
            --current-run-id "$CURRENT_RUN_ID"

  package-check:
    name: cargo package dry-run
    if: github.event_name == 'workflow_dispatch'
    needs: release-admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # v2
      - name: Package and verify only Stable crates
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t stable_crates < <(
            python3 scripts/parse_release_plan.py \
              --list-stable \
              --tag "$RELEASE_TAG"
          )
          mapfile -t stable_paths < <(
            python3 scripts/parse_release_plan.py \
              --list-stable-paths \
              --tag "$RELEASE_TAG"
          )
          if [ "${#stable_crates[@]}" -eq 0 ] ||
             [ "${#stable_crates[@]}" -ne "${#stable_paths[@]}" ]; then
            echo "::error::Stable package list/path mismatch"
            exit 1
          fi

          # A first stable release cannot resolve its own unpublished internal
          # dependency versions from crates.io. Patch those dependencies to
          # the exact checked-out tag only for package verification. The
          # generated crate manifests still contain normal crates.io version
          # requirements, and the publish job uploads them in dependency order.
          patch_args=()
          for record in "${stable_paths[@]}"; do
            IFS=$'\t' read -r crate relative_path <<< "$record"
            test -n "$crate"
            test -n "$relative_path"
            patch_args+=(
              --config
              "patch.crates-io.${crate}.path=\"${GITHUB_WORKSPACE}/${relative_path}\""
            )
          done

          echo "Packaging ${#stable_crates[@]} Stable crates:"
          printf '  - %s\n' "${stable_crates[@]}"
          for crate in "${stable_crates[@]}"; do
            cargo package \
              --locked \
              --all-features \
              -p "$crate" \
              "${patch_args[@]}"
          done
      - name: Verify rill-ml crates.io publish request
        run: cargo publish --locked --dry-run -p rill-ml --features serde
      # rust-cache's post-job cleanup walks target/package/<crate>-*/ and tries
      # to clean non-existent tests/target & tests/trybuild dirs, spamming
      # ENOENT errors (Swatinem/rust-cache#193). Drop the extracted source
      # copies now; the .crate archives are the real deliverable and stay.
      - name: Prune extracted package copies
        shell: bash
        run: |
          find target/package -mindepth 1 -maxdepth 1 -type d -print0 2>/dev/null | xargs -0 -r rm -rf

  build-runtime:
    name: Runtime ${{ matrix.target_os }} ${{ matrix.target_arch }}
    if: github.event_name == 'workflow_dispatch'
    needs: package-check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            target_os: linux
            target_arch: x86_64
            extension: ""
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            target_os: windows
            target_arch: x86_64
            extension: .exe
          - runner: windows-11-arm
            # Phase 4: native Windows ARM64 Runtime. Built on the GitHub-hosted
            # ARM64 Windows runner so the released asset is genuinely built on
            # aarch64-pc-windows-msvc (no MSVC cross-toolchain needed).
            rust_target: aarch64-pc-windows-msvc
            target_os: windows
            target_arch: aarch64
            extension: .exe
          - runner: macos-14
            rust_target: aarch64-apple-darwin
            target_os: macos
            target_arch: aarch64
            extension: ""
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2 # v2
        with:
          key: runtime-${{ matrix.rust_target }}
      - name: Check Apple signing secrets
        if: matrix.target_os == 'macos'
        id: apple_secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "${APPLE_CERTIFICATE_P12_BASE64:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple Developer ID secrets are not configured. macOS aarch64 runtime will still be built and uploaded, but the binary will be unsigned and not notarized. This is the accepted permanent project policy (see STABILITY.md § macOS unsigned policy). Configure APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY in the repository secrets to enable optional codesign."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build runtime (with wasm feature for handler support)
        run: cargo build --locked --release --target ${{ matrix.rust_target }} -p rill-runtime --bin rill-runtime --features wasm
      - name: Import Apple Developer ID certificate
        if: matrix.target_os == 'macos' && steps.apple_secrets.outputs.has_secrets == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path("certificate.p12").write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"]))
          PY
          security create-keychain -p "${RUNNER_TEMP}" rill-signing.keychain-db
          security set-keychain-settings -lut 21600 rill-signing.keychain-db
          security unlock-keychain -p "${RUNNER_TEMP}" rill-signing.keychain-db
          security import certificate.p12 -k rill-signing.keychain-db -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s rill-signing.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${RUNNER_TEMP}" rill-signing.keychain-db
      - name: Code-sign macOS runtime
        if: matrix.target_os == 'macos' && steps.apple_secrets.outputs.has_secrets == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "target/${{ matrix.rust_target }}/release/rill-runtime"
          codesign --verify --strict --verbose=2 "target/${{ matrix.rust_target }}/release/rill-runtime"
      - name: Mark unsigned macOS asset
        # Permanent project policy: macOS aarch64 runtime is always built
        # and uploaded. When Apple Developer ID secrets are absent, the
        # binary is unsigned and not notarized. This step writes a
        # sidecar metadata file so the release index and release notes
        # can accurately reflect the unsigned status without modifying
        # the frozen release-index schema.
        if: matrix.target_os == 'macos' && steps.apple_secrets.outputs.has_secrets == 'false'
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          cat > "dist/rill-runtime-${version}-macos-aarch64.unsigned.json" <<EOF
          {
            "artifact": "rill-runtime-${version}-macos-aarch64",
            "platform": "macos",
            "arch": "aarch64",
            "version": "${version}",
            "codeSigning": "unsigned",
            "notarization": false,
            "reason": "Apple Developer ID Application certificate is not configured. This is the accepted permanent project policy (see STABILITY.md § macOS unsigned policy). The binary is still functional; macOS users may need to bypass Gatekeeper via Finder right-click → Open or System Settings → Privacy & Security → Allow."
          }
          EOF
          echo "macOS aarch64 runtime will be uploaded as unsigned (not notarized)."
      - name: Stage asset
        shell: python
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          TARGET: ${{ matrix.rust_target }}
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          import os, pathlib, shutil
          version = os.environ["VERSION"].removeprefix("v")
          extension = os.environ["EXTENSION"]
          source = pathlib.Path("target") / os.environ["TARGET"] / "release" / f"rill-runtime{extension}"
          output = pathlib.Path("dist") / f"rill-runtime-{version}-{os.environ['TARGET_OS']}-{os.environ['TARGET_ARCH']}{extension}"
          output.parent.mkdir(exist_ok=True)
          shutil.copyfile(source, output)
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/rill-runtime-*
          if-no-files-found: error

  # Phase 6: Linux musl + aarch64 Runtime publish assets. These three targets
  # have no GitHub-hosted native runner. Compiling release assets does NOT
  # require Docker: we cross-compile directly on the ubuntu runner with
  # cargo-zigbuild, which bundles Zig's Clang-based C compiler, assembler and
  # linker plus its own musl libc. A single install produces correct GNU and
  # musl binaries for both x86_64 and aarch64 — no hand-rolled cross toolchain
  # and no QEMU/container needed for compilation. (Real execution of these
  # assets is separately verified under Docker+QEMU by the cross-platform
  # workflow.) GNU and musl assets of the same OS+arch are distinguished by the
  # stable artifact id (rill-runtime vs rill-runtime-musl) in the frozen v2
  # index.
  build-runtime-cross:
    name: Runtime cross ${{ matrix.target_os }} ${{ matrix.target_arch }} ${{ matrix.libc }}
    if: github.event_name == 'workflow_dispatch'
    needs: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-musl
            target_os: linux
            target_arch: x86_64
            libc: musl
            asset_suffix: linux-x86_64-musl
          - rust_target: aarch64-unknown-linux-gnu
            target_os: linux
            target_arch: aarch64
            libc: gnu
            asset_suffix: linux-aarch64
          - rust_target: aarch64-unknown-linux-musl
            target_os: linux
            target_arch: aarch64
            libc: musl
            asset_suffix: linux-aarch64-musl
          - rust_target: riscv64gc-unknown-linux-gnu
            target_os: linux
            target_arch: riscv64
            libc: gnu
            asset_suffix: linux-riscv64
          - rust_target: armv7-unknown-linux-gnueabihf
            target_os: linux
            target_arch: armv7
            libc: gnu
            asset_suffix: linux-armv7
          - rust_target: s390x-unknown-linux-gnu
            target_os: linux
            target_arch: s390x
            libc: gnu
            asset_suffix: linux-s390x
          - rust_target: powerpc64le-unknown-linux-gnu
            target_os: linux
            target_arch: powerpc64le
            libc: gnu
            asset_suffix: linux-powerpc64le
          - rust_target: loongarch64-unknown-linux-gnu
            target_os: linux
            target_arch: loongarch64
            libc: gnu
            asset_suffix: linux-loongarch64
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}
      - name: Install Zig (C cross toolchain used by cargo-zigbuild)
        uses: xyzzylabs/setup-zig@v1
        with:
          # Partition the shared zig cache/tarball keys per target so parallel
          # matrix jobs don't race to save the same key ("Unable to reserve
          # cache" warnings). Consistent with the rust-cache key below.
          cache-key: ${{ matrix.rust_target }}
      - name: Install cargo-zigbuild
        run: pip3 install --disable-pip-version-check "cargo-zigbuild==0.20.1"
      - uses: Swatinem/rust-cache@v2 # v2
        with:
          key: runtime-${{ matrix.rust_target }}-zigbuild
      - name: Build runtime for ${{ matrix.rust_target }}
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          RUST_TARGET: ${{ matrix.rust_target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          # cargo-zigbuild links the target against Zig's bundled musl/glibc,
          # so aarch64-unknown-linux-musl genuinely links musl — never the host
          # x86_64 musl-gcc or a glibc cross-compiler masquerading as musl.
          cargo zigbuild --locked --release --target "$RUST_TARGET" \
            -p rill-runtime --bin rill-runtime --features wasm
          mkdir -p dist
          cp "target/$RUST_TARGET/release/rill-runtime" \
            "dist/rill-runtime-${version}-${ASSET_SUFFIX}"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target_os }}-${{ matrix.target_arch }}-${{ matrix.libc }}
          path: dist/rill-runtime-*
          if-no-files-found: error

  # FreeBSD cannot be built with cargo-zigbuild: Zig has no FreeBSD target
  # support. Build the release binary inside the same native FreeBSD VM tier
  # used by the Stable gate and post-release verifier, so the published asset
  # is both natively linked and kernel-tested rather than a mislabeled Linux
  # cross-build.
  build-runtime-freebsd:
    name: Runtime freebsd x86_64 native VM
    if: github.event_name == 'workflow_dispatch'
    needs: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Build FreeBSD runtime in native VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust bash
          run: |
            set -euo pipefail
            version="${{ env.RELEASE_TAG }}"
            version="${version#v}"
            rust_target=x86_64-unknown-freebsd
            cargo build --locked --release --target "$rust_target" \
              -p rill-runtime --bin rill-runtime --features wasm
            mkdir -p dist
            cp "target/$rust_target/release/rill-runtime" \
              "dist/rill-runtime-${version}-freebsd-x86_64"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-freebsd-x86_64
          path: dist/rill-runtime-*
          if-no-files-found: error

  publish:
    name: Sign and publish
    if: github.event_name == 'workflow_dispatch'
    needs: [build-runtime, build-runtime-cross, build-runtime-freebsd]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      channel: ${{ steps.version.outputs.channel }}
      index_file: ${{ steps.version.outputs.index_file }}
      pointer_release: ${{ steps.version.outputs.pointer_release }}
      pointer_title: ${{ steps.version.outputs.pointer_title }}
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          # Build assets are bound to RELEASE_TAG above. This job also runs
          # release tooling (SBOM/index generators); use the workflow revision
          # so an immutable same-tag retry can carry a reviewed tooling fix
          # without rewriting the tag's source commit.
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - name: Resolve immutable tag commit for release identity
        id: release_identity
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_ref="${TAG}^{}"
          echo "commit=$(git rev-parse "$tag_ref")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Accept both stable (v1.0.0) and prerelease (v1.0.0-rc.1) SemVer
          # tags. The prerelease suffix is required for candidate-channel
          # routing: a version containing a hyphen publishes to the
          # candidate pointer and never updates the stable pointer.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)" = "$version"
          test "$(python3 -c 'import json; print(json.load(open("models/example-default/manifest.json"))["version"])')" = "$version"
          # SemVer 2.0: a prerelease version contains a hyphen after the
          # patch number (e.g. 1.0.0-rc.1). Stable versions do not.
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
            channel=candidate
            index_file=candidate-index.json
            pointer_release=local-ai-candidate
            pointer_title="Rill Local AI candidate index"
          else
            is_prerelease=false
            channel=stable
            index_file=stable-index.json
            pointer_release=local-ai-stable
            pointer_title="Rill Local AI stable index"
          fi
          {
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "channel=$channel"
            echo "index_file=$index_file"
            echo "pointer_release=$pointer_release"
            echo "pointer_title=$pointer_title"
          } >> "$GITHUB_OUTPUT"
      - name: Build signing tool
        run: cargo build --locked --release -p rill-runtime --bin rill-pack
      - name: Publish Stable crates to crates.io (driven by release-plan.toml)
        # 1.0 freeze: the publish list is driven entirely by
        # ``release-plan.toml``.  Only the Stable group is published; Preview
        # crates are never published by a Stable-version tag and must not appear in the
        # loop.  This replaces the previous hardcoded list that included
        # Preview crates and relied on crates.io returning "already exists"
        # to skip them — that behaviour violated the release plan contract.
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Validate the release plan and emit the Stable publish order.
          # ``--tag`` validates that the Stable version matches the release tag.
          mapfile -t stable_crates < <(python3 scripts/parse_release_plan.py --list-stable --tag "$RELEASE_TAG")
          if [ "${#stable_crates[@]}" -eq 0 ]; then
            echo "::error::release-plan.toml [stable] has an empty crates list"
            exit 1
          fi
          echo "Publishing ${#stable_crates[@]} Stable crates (driven by release-plan.toml):"
          printf '  - %s\n' "${stable_crates[@]}"
          for crate in "${stable_crates[@]}"; do
            published=false
            for attempt in {1..10}; do
              if output=$(cargo publish -p "$crate" --no-verify 2>&1); then
                echo "$output"
                published=true
                break
              fi
              if echo "$output" | grep -q "already exists"; then
                echo "$crate already published, continuing"
                published=true
                break
              elif echo "$output" | grep -Eq "failed to select a version|no matching package named" && [ "$attempt" -lt 10 ]; then
                echo "Waiting for crates.io to index dependencies before publishing $crate (attempt $attempt/10)"
                sleep 15
              else
                echo "$output"
                exit 1
              fi
            done
            if [ "$published" != true ]; then
              echo "Timed out waiting to publish $crate"
              exit 1
            fi
          done
          # Verify that Preview crates were NOT published by this release tag.
          mapfile -t preview_crates < <(python3 scripts/parse_release_plan.py --list-preview)
          echo "Preview crates (NOT published by this release tag):"
          printf '  - %s\n' "${preview_crates[@]}"
      - name: Verify existing channel index when present
        env:
          GH_TOKEN: ${{ github.token }}
          POINTER_RELEASE: ${{ steps.version.outputs.pointer_release }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          # Download the existing index from the channel-appropriate pointer
          # release (local-ai-stable for stable, local-ai-candidate for
          # prerelease). The downloaded file is used as the merge base so a
          # newer model/handler from a prior release in the same channel is
          # retained. A candidate release never reads or writes the stable
          # pointer.
          if gh release download "$POINTER_RELEASE" --pattern "$INDEX_FILE" --dir dist; then
            mv "dist/$INDEX_FILE" dist/current-index.json
            if ! target/release/rill-pack verify-index \
              --index dist/current-index.json \
              --key-id "$PUBLISHER_KEY_ID" \
              --public-key-hex "$RILL_PUBLIC_KEY_HEX"; then
              echo "::warning::Existing $INDEX_FILE could not be verified (possibly incompatible schema). Treating as fresh release."
              rm -f dist/current-index.json
            fi
          fi
      - name: Create signed model package
        env:
          RILL_SIGNING_KEY_HEX: ${{ secrets.RILL_SIGNING_KEY_HEX }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RILL_SIGNING_KEY_HEX"
          target/release/rill-pack create \
            --manifest models/example-default/manifest.json \
            --model models/example-default/model.json \
            --output "dist/example-default-${VERSION}.rillpack"
      - name: Install wasm-tools
        # Exact release-tool version shared with the CI build job.
        run: cargo install wasm-tools --locked --version "1.254.0"
      - name: Record resolved wasm-tools version
        run: wasm-tools --version
      - name: Build and sign echo handler package
        env:
          RILL_SIGNING_KEY_HEX: ${{ secrets.RILL_SIGNING_KEY_HEX }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RILL_SIGNING_KEY_HEX"
          cd handlers/echo-handler
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../../target
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/echo-handler.wasm \
            -o ../../target/echo-handler.wasm
          cd ../..
          target/release/rill-pack create-handler \
            --manifest handlers/echo-handler/manifest.json \
            --module target/echo-handler.wasm \
            --output "dist/echo-handler-${VERSION}.rillhandler"
      - name: Build and sign release index
        env:
          RILL_SIGNING_KEY_HEX: ${{ secrets.RILL_SIGNING_KEY_HEX }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          extra=()
          if [ -f dist/current-index.json ]; then
            extra+=(--existing-index dist/current-index.json)
          fi
          python3 scripts/build-release-index.py \
            --release-dir dist \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --publisher-key-id "$PUBLISHER_KEY_ID" \
            --generated-at "$generated_at" \
            --channel "$CHANNEL" \
            --output dist/index-payload.json \
            "${extra[@]}"
          target/release/rill-pack sign-index \
            --payload dist/index-payload.json \
            --output "dist/$INDEX_FILE"
      - name: Verify signed outputs before publishing
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          target/release/rill-pack verify \
            --pack "dist/example-default-${VERSION}.rillpack" \
            --key-id "$PUBLISHER_KEY_ID" \
            --public-key-hex "$RILL_PUBLIC_KEY_HEX"
          target/release/rill-pack inspect-handler \
            --handler "dist/echo-handler-${VERSION}.rillhandler" \
            --key-id "$PUBLISHER_KEY_ID" \
            --public-key-hex "$RILL_PUBLIC_KEY_HEX"
          target/release/rill-pack verify-index \
            --index "dist/$INDEX_FILE" \
            --key-id "$PUBLISHER_KEY_ID" \
            --public-key-hex "$RILL_PUBLIC_KEY_HEX"
      - name: Generate CycloneDX and SPDX SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_args=()
          for path in dist/rill-runtime-* dist/*.rillpack dist/*.rillhandler "dist/$INDEX_FILE"; do
            if [ -f "$path" ]; then
              artifact_args+=(--artifact "$(basename "$path")=$path")
            fi
          done
          test "${#artifact_args[@]}" -gt 0
          python3 scripts/generate_sbom.py \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "${{ steps.release_identity.outputs.commit }}" \
            --output-dir dist \
            "${artifact_args[@]}"
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Release already exists — overwrite all assets.
            gh release upload "$RELEASE_TAG" \
              dist/rill-runtime-* dist/*.rillpack dist/*.rillhandler "dist/$INDEX_FILE" dist/*.cdx.json dist/*.spdx.json \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Rill ML ${{ steps.version.outputs.version }}" \
              "${prerelease_args[@]}"
          else
            gh release create "$RELEASE_TAG" dist/rill-runtime-* dist/*.rillpack dist/*.rillhandler "dist/$INDEX_FILE" dist/*.cdx.json dist/*.spdx.json \
              --verify-tag \
              --title "Rill ML ${{ steps.version.outputs.version }}" \
              --notes "macOS aarch64 runtime policy: the official asset is published without Apple Developer ID signing or notarization when signing credentials are absent. This is an accepted, non-blocking policy; the accompanying .unsigned.json sidecar records the exact status. Users can authorize first launch through Finder → Open or System Settings → Privacy & Security." \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
  post-release-verify-sbom:
    name: Post-release verify SBOM identity
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Download published SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern 'rill-ml-*.cdx.json' --dir dist
          gh release download "$RELEASE_TAG" --pattern 'rill-ml-*.spdx.json' --dir dist
      - name: Verify published SBOM identity and checksums
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          INDEX_FILE: ${{ needs.publish.outputs.index_file }}
        run: |
          set -euo pipefail
          python3 scripts/verify_sbom.py \
            --cdx "dist/rill-ml-${VERSION}.cdx.json" \
            --spdx "dist/rill-ml-${VERSION}.spdx.json" \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)"
      - name: Install pinned standard SBOM validators
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-sbom.txt
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.29.0/cyclonedx-linux-x64"
          echo "411bd30d28ca705500f0b5a7f4a896749cad1b082deb5245ece7b386e496c48c  $RUNNER_TEMP/cyclonedx" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/cyclonedx"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate published SBOMs against standards
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          cyclonedx validate \
            --input-file "dist/rill-ml-${VERSION}.cdx.json" \
            --input-format json \
            --input-version 1.5
          python3 scripts/validate_sbom_standards.py \
            --spdx "dist/rill-ml-${VERSION}.spdx.json"
  release-host-smoke:
    name: Independent released-asset host smoke
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Build public package verifier
        run: cargo build --locked --release -p rill-runtime --bin rill-pack
      - name: Exercise published runtime, model, and handler
        shell: bash
        run: |
          set -euo pipefail
          python3 smoke-test/host_smoke.py \
            --index-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${{ needs.publish.outputs.index_file }}" \
            --expected-version "${{ needs.publish.outputs.version }}" \
            --expected-channel "${{ needs.publish.outputs.channel }}" \
            --rill-pack-bin target/release/rill-pack \
            --log smoke-test/smoke-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: released-asset-host-smoke-${{ needs.publish.outputs.version }}
          path: smoke-test/smoke-result.json
          if-no-files-found: error

  post-release-verify:
    name: Post-release verify (${{ matrix.target }})
    # Post-release artifact verification: downloads the ACTUAL GitHub Release
    # runtime asset (not a fresh source build), checks its size/SHA-256 against
    # the signed release index, then executes that exact binary inside a
    # container whose platform matches the target (QEMU/binfmt for aarch64) and
    # runs the signed-model / signed-handler / IPC host smoke. Covers the Linux
    # Supported runtime assets that have usable rust:* container manifests
    # (gnu+musl of x86_64/aarch64, plus armv7/s390x/powerpc64le). RISC-V64 and
    # LoongArch64 are re-verified under DIRECT user-mode QEMU instead by
    # post-release-verify-direct-qemu (no container-manifest dependency).
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            runtime_id: rill-runtime
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
            runtime_id: rill-runtime-musl
          - target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            runtime_id: rill-runtime
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
            runtime_id: rill-runtime-musl
          - target: armv7-unknown-linux-gnueabihf
            platform: linux/arm/v7
            runtime_id: rill-runtime
          - target: s390x-unknown-linux-gnu
            platform: linux/s390x
            runtime_id: rill-runtime
          - target: powerpc64le-unknown-linux-gnu
            platform: linux/ppc64le
            runtime_id: rill-runtime
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up QEMU / binfmt_misc
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-buildx-action@v4
      - name: Build verifier and re-verify the real published asset
        env:
          INDEX_FILE: ${{ needs.publish.outputs.index_file }}
          VERSION: ${{ needs.publish.outputs.version }}
          CHANNEL: ${{ needs.publish.outputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          RUNTIME_ID: ${{ matrix.runtime_id }}
        shell: bash
        run: |
          set -euo pipefail
          index_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${INDEX_FILE}"
          docker build -t "rill-post-verify-${RUNTIME_ID}" -f- . <<EOF
          FROM --platform=${PLATFORM} rust:1.94.0-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          EOF
          docker run --rm \
            -e "RUSTFLAGS=-D warnings" \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            "rill-post-verify-${RUNTIME_ID}" \
            bash -c "
              set -euo pipefail
              export PATH=\"/usr/local/cargo/bin:\$PATH\"
              # rill-pack is the pack verifier only — it needs no wasm feature.
              # Build with --no-default-features so the verifier never compiles
              # wasmtime (which SIGSEGVs under QEMU on s390x / is extremely slow
              # on armv7+powerpc64le). The published asset being re-verified is
              # the real --features wasm binary downloaded from the Release.
              cargo build --locked --release -p rill-runtime --bin rill-pack --no-default-features
              python3 smoke-test/host_smoke.py \
                --index-url '$index_url' \
                --expected-version '$VERSION' \
                --expected-channel '$CHANNEL' \
                --runtime-id '$RUNTIME_ID' \
                --rill-pack-bin target/release/rill-pack \
                --log smoke-test/post-release-${{ matrix.target }}.json
            "
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: post-release-verify-${{ matrix.target }}
          path: smoke-test/post-release-${{ matrix.target }}.json
          # Supported-target evidence must always exist; a missing JSON is a
          # release gate failure, never a warning.
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Post-release re-verify of the published FreeBSD runtime asset. Docker +
  # QEMU cannot run the FreeBSD kernel, so the published asset is re-downloaded
  # and re-executed inside a native FreeBSD VM (vmactions/freebsd-vm) via the
  # same host_smoke.py used by the other platforms.
  # ─────────────────────────────────────────────────────────────────────────
  post-release-verify-freebsd:
    name: Post-release verify FreeBSD (native VM)
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Re-verify the published FreeBSD runtime in a native FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust python3 bash
          # vmactions/freebsd-vm runs this script over ssh and does NOT reliably
          # propagate workflow/step env vars (RELEASE_TAG kept coming through
          # empty, tripping `set -u`). Inline every value at template-expansion
          # time on the host so the VM script is self-contained.
          run: |
            set -euo pipefail
            index_url="https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ needs.publish.outputs.index_file }}"
            cargo build --locked --release -p rill-runtime --bin rill-pack
            python3 smoke-test/host_smoke.py \
              --index-url "$index_url" \
              --expected-version "${{ needs.publish.outputs.version }}" \
              --expected-channel "${{ needs.publish.outputs.channel }}" \
              --runtime-id rill-runtime \
              --rill-pack-bin target/release/rill-pack \
              --log smoke-test/post-release-freebsd.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: post-release-verify-freebsd
          path: smoke-test/post-release-freebsd.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Post-release re-verify of the published RISC-V64 / LoongArch64 runtime
  # assets — DIRECT user-mode QEMU on the native Actions host, no Docker, no
  # dependence on an upstream rust:* container manifest for the platform
  # The published asset is downloaded from the
  # GitHub Release and executed under qemu-user with the same sysroot / -cpu /
  # LD_LIBRARY_PATH config used by the Stable gates
  # (scripts/qemu-cross-gate.sh / loongarch-cross-gate.sh).
  # ─────────────────────────────────────────────────────────────────────────
  post-release-verify-direct-qemu:
    name: Post-release verify direct QEMU (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Build rill-pack verifier (host, no wasm feature)
        run: cargo build --locked --release -p rill-runtime --bin rill-pack --no-default-features
      - name: Re-verify the published ${{ matrix.target }} asset under direct QEMU
        env:
          INDEX_FILE: ${{ needs.publish.outputs.index_file }}
          VERSION: ${{ needs.publish.outputs.version }}
          CHANNEL: ${{ needs.publish.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          index_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${INDEX_FILE}"
          bash scripts/post-release-qemu-verify.sh "${{ matrix.target }}" \
            --index-url "$index_url" \
            --expected-version "$VERSION" \
            --expected-channel "$CHANNEL" \
            --runtime-id rill-runtime \
            --rill-pack-bin target/release/rill-pack \
            --log "smoke-test/post-release-direct-qemu-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: post-release-verify-direct-qemu-${{ matrix.target }}
          path: smoke-test/post-release-direct-qemu-${{ matrix.target }}.json
          # Supported-target evidence must always exist; a missing JSON is a
          # release gate failure, never a warning.
          if-no-files-found: error

  post-release-verify-native:
    name: Post-release verify native (${{ matrix.os }})
    # Post-release artifact verification on the platform's own native GitHub
    # runner. Downloads the ACTUAL Windows runtime asset from the GitHub
    # Release, checks its size/SHA-256 against the signed release index, then
    # executes that exact binary and runs the signed-model / signed-handler /
    # IPC host smoke (handshake / health / invoke / invalid JSON / graceful
    # shutdown) via the same host_smoke.py used by the other platforms.
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: actions/setup-python@v7
        # host_smoke.py is run with ``python3``. The Linux jobs use the
        # preinstalled python3; setup-python reliably provides the ``python3``
        # command on Windows runners.
        with:
          python-version: '3.12'
      - name: Build rill-pack verifier (no wasm feature)
        shell: bash
        run: cargo build --locked --release -p rill-runtime --bin rill-pack --no-default-features
      - name: Re-verify the published native runtime asset
        shell: bash
        env:
          INDEX_FILE: ${{ needs.publish.outputs.index_file }}
          VERSION: ${{ needs.publish.outputs.version }}
          CHANNEL: ${{ needs.publish.outputs.channel }}
        run: |
          set -euo pipefail
          index_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${INDEX_FILE}"
          pack_bin="target/release/rill-pack"
          if [ -f "target/release/rill-pack.exe" ]; then
            pack_bin="target/release/rill-pack.exe"
          fi
          python3 smoke-test/host_smoke.py \
            --index-url "$index_url" \
            --expected-version "$VERSION" \
            --expected-channel "$CHANNEL" \
            --runtime-id rill-runtime \
            --rill-pack-bin "$pack_bin" \
            --log "smoke-test/post-release-native-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: post-release-verify-native-${{ matrix.arch }}
          path: smoke-test/post-release-native-${{ matrix.arch }}.json
          # Supported-target evidence must always exist; a missing JSON is a
          # release gate failure, never a warning.
          if-no-files-found: error

  move-index-pointer:
    name: Promote verified signed index pointer
    if: github.event_name == 'workflow_dispatch'
    needs: [publish, release-host-smoke, post-release-verify, post-release-verify-sbom, post-release-verify-direct-qemu, post-release-verify-freebsd, post-release-verify-native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Build public package verifier
        run: cargo build --locked --release -p rill-runtime --bin rill-pack
      - name: Download and verify immutable release index
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_FILE: ${{ needs.publish.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "$INDEX_FILE" --dir dist
          target/release/rill-pack verify-index \
            --index "dist/$INDEX_FILE" \
            --key-id "$PUBLISHER_KEY_ID" \
            --public-key-hex "$RILL_PUBLIC_KEY_HEX"
      - name: Move signed index pointer after released-asset smoke
        env:
          GH_TOKEN: ${{ github.token }}
          POINTER_RELEASE: ${{ needs.publish.outputs.pointer_release }}
          POINTER_TITLE: ${{ needs.publish.outputs.pointer_title }}
          INDEX_FILE: ${{ needs.publish.outputs.index_file }}
          IS_PRERELEASE: ${{ needs.publish.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # A prerelease updates only local-ai-candidate; a stable release
          # updates only local-ai-stable. The pointer does not move until the
          # immutable release assets pass the independent external-host smoke.
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Prerelease verified: updating candidate pointer only."
          else
            echo "Stable release verified: updating stable pointer only."
          fi
          gh release view "$POINTER_RELEASE" >/dev/null 2>&1 || \
            gh release create "$POINTER_RELEASE" --title "$POINTER_TITLE" --notes "Machine-readable signed update index."
          gh release upload "$POINTER_RELEASE" "dist/$INDEX_FILE" --clobber

  publish-python:
    name: Publish Python bindings to PyPI
    if: github.event_name == 'workflow_dispatch'
    needs: move-index-pointer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Check whether Python version matches the release tag
        id: python_version_check
        shell: bash
        run: |
          set -euo pipefail
          # The Python crate is in the Preview version group and may carry a
          # different version from the Stable group (the tag version). Only
          # publish to PyPI when the two match; otherwise the job would try
          # to re-upload an already-published Preview version and fail the
          # visibility check against the wrong version. The 1.0 RC cycle
          # (Stable=1.0.0-rc.x, Preview=0.13.0) skips PyPI entirely; the
          # Python crate is not a 1.0 blocking artifact (see STABILITY.md).
          tag_version="${RELEASE_TAG#v}"
          python_version="$(python3 -c 'import tomllib; print(tomllib.loads(open("crates/rill-ml-python/pyproject.toml","rb").read().decode())["project"]["version"])')"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
          if [ "$tag_version" = "$python_version" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Python version ($python_version) matches tag ($tag_version); will publish."
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Python version ($python_version) differs from tag ($tag_version); skipping PyPI publish (Preview crate is not a 1.0 blocking artifact)."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.python_version_check.outputs.should_publish == 'true'
      - uses: Swatinem/rust-cache@v2 # v2
        if: steps.python_version_check.outputs.should_publish == 'true'
      - name: Install Python build toolchain (exact versions)
        if: steps.python_version_check.outputs.should_publish == 'true'
        # ``requirements-dev.txt`` is the exact tool version source of truth
        # shared by CI and release.
        run: |
          pip install -r scripts/requirements-dev.txt
          # Record the actually resolved versions for release traceability.
          maturin --version
          pytest --version
      - name: Verify PyPI token is configured
        if: steps.python_version_check.outputs.should_publish == 'true'
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MATURIN_PYPI_TOKEN:-}" ]; then
            echo "::error::MATURIN_PYPI_TOKEN is not configured. Python bindings are part of the official release (see README §模块总览); a missing token must fail the release rather than silently skipping. Add the secret to the repository or remove this job if Python support is being dropped."
            exit 1
          fi
      - name: maturin publish
        if: steps.python_version_check.outputs.should_publish == 'true'
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
        working-directory: crates/rill-ml-python
        run: maturin publish --no-sdist
      - name: Verify PyPI release is visible
        if: steps.python_version_check.outputs.should_publish == 'true'
        env:
          PYTHON_VERSION: ${{ steps.python_version_check.outputs.python_version }}
        run: |
          set -euo pipefail
          version="$PYTHON_VERSION"
          # PyPI's JSON API may lag a few seconds behind the upload. Retry
          # for up to a minute before reporting the publish as failed.
          package="rill-ml-python"
          for attempt in $(seq 1 12); do
            if python3 -c "
          import json, urllib.request
          url = 'https://pypi.org/pypi/${package}/${version}/json'
          with urllib.request.urlopen(url, timeout=10) as response:
              json.load(response)
          "; then
              echo "PyPI release ${package}==${version} is visible."
              exit 0
            fi
            echo "PyPI release not visible yet (attempt $attempt/12); retrying in 5s..."
            sleep 5
          done
          echo "::error::PyPI release ${package}==${version} was not visible after 60s. Investigate https://pypi.org/project/${package}/${version}/ before announcing the release."
          exit 1

  publish-wasm:
    name: Publish WASM bindings to npm
    if: github.event_name == 'workflow_dispatch'
    needs: move-index-pointer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Check whether WASM version matches the release tag
        id: wasm_version_check
        shell: bash
        run: |
          set -euo pipefail
          # The WASM crate is in the Preview version group and may carry a
          # different version from the Stable group (the tag version). Only
          # publish to npm when the two match; otherwise the job would try to
          # re-upload an already-published Preview version and fail the
          # visibility check against the wrong version. The 1.0 RC cycle
          # (Stable=1.0.0-rc.x, Preview=0.15.0) skips npm entirely; the WASM
          # crate is not a 1.0 blocking artifact (see STABILITY.md).
          tag_version="${RELEASE_TAG#v}"
          wasm_version="$(python3 -c 'import json; print(json.load(open("crates/rill-ml-wasm/package.json"))["version"])')"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "wasm_version=$wasm_version" >> "$GITHUB_OUTPUT"
          if [ "$tag_version" = "$wasm_version" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "WASM version ($wasm_version) matches tag ($tag_version); will publish."
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "WASM version ($wasm_version) differs from tag ($tag_version); skipping npm publish (Preview crate is not a release-blocking artifact)."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.wasm_version_check.outputs.should_publish == 'true'
      - name: Build WASM package (pkg/ + pkg-node/)
        if: steps.wasm_version_check.outputs.should_publish == 'true'
        run: bash scripts/wasm-pack-build.sh
      - name: Verify npm token is configured and valid
        if: steps.wasm_version_check.outputs.should_publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not configured. WASM bindings are part of the official release; a missing token must fail the release rather than silently skipping. Add the secret to the repository or remove this job if WASM support is being dropped."
            exit 1
          fi
          cat > "$HOME/.npmrc" <<'EOF'
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF
          if ! npm whoami --registry=https://registry.npmjs.org >/tmp/npmwhoami.out 2>/tmp/npmwhoami.err; then
            echo "::error::NPM_TOKEN is INVALID or EXPIRED. npm whoami failed:"
            cat /tmp/npmwhoami.err
            echo "::error::Regenerate a new 90-day Granular access token for rill-ml-wasm and update the NPM_TOKEN secret before the next release."
            exit 1
          fi
          echo "NPM_TOKEN authenticates npm user: $(cat /tmp/npmwhoami.out)"
      - name: npm publish
        if: steps.wasm_version_check.outputs.should_publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: crates/rill-ml-wasm
        run: |
          set -euo pipefail
          cat > .npmrc <<'EOF'
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF
          npm publish --access public
      - name: Verify npm release is visible
        if: steps.wasm_version_check.outputs.should_publish == 'true'
        env:
          WASM_VERSION: ${{ steps.wasm_version_check.outputs.wasm_version }}
        run: |
          set -euo pipefail
          version="$WASM_VERSION"
          for attempt in $(seq 1 12); do
            if npm view "rill-ml-wasm@${version}" version 2>/dev/null | grep -qx "$version"; then
              echo "npm release rill-ml-wasm@${version} is visible."
              exit 0
            fi
            echo "npm release not visible yet (attempt $attempt/12); retrying in 5s..."
            sleep 5
          done
          echo "::error::npm release rill-ml-wasm@${version} was not visible after 60s. Investigate https://www.npmjs.com/package/rill-ml-wasm/v/${version} before announcing the release."
          exit 1
