name: CI / Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0}', inputs.tag) || 'CI' }}

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v0.7.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  PUBLISHER_KEY_ID: rillml-examples-2026-001
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RILL_PUBLIC_KEY_HEX: 29fd1fc2f22bd7e405aec167ff0a0d8de791f011c415075d4c5f9f64fd93fc2e

# ─────────────────────────────────────────────────────────────────────────────
# CI jobs — run on push (branches) and pull_request, never on workflow_dispatch.
# Release jobs — run only on workflow_dispatch (auto-release dispatches them
# after CI succeeds; the tag-push trigger is intentionally omitted to avoid
# duplicate runs).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  fmt:
    name: cargo fmt
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --exclude rill-ml-python -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.rust }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - name: cargo test workspace
        run: cargo test --locked --workspace --all-targets --all-features --exclude rill-ml-python
      - name: cargo test docs
        run: cargo test --locked --workspace --doc --all-features --exclude rill-ml-python

  msrv:
    name: MSRV (1.94) lib check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo +1.94 check rill-ml --lib
        run: cargo +1.94.0 check --locked --lib
      - name: cargo +1.94 check rill-ml --lib --features serde
        run: cargo +1.94.0 check --locked --lib --features serde
      - name: cargo +1.94 check rill-handler-api
        run: cargo +1.94.0 check --locked -p rill-handler-api
      - name: cargo +1.94 check rill-runtime-protocol
        run: cargo +1.94.0 check --locked -p rill-runtime-protocol
      - name: cargo +1.94 check rill-runtime (default features)
        run: cargo +1.94.0 check --locked -p rill-runtime
      - name: cargo +1.94 check rill-runtime (wasm feature)
        run: cargo +1.94.0 check --locked -p rill-runtime --features wasm

  doc:
    name: cargo doc
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc --features serde --no-deps
        run: cargo doc --locked --features serde --no-deps

  public-api:
    name: public API baseline
    # 1.0 freeze: `cargo-public-api` baseline is used for precise drift
    # review — it catches unexpected API additions/removals that require
    # human judgement. `cargo-semver-checks` (see the `semver-checks`
    # job below) is the authoritative tool for judging SemVer
    # compatibility. The two tools are complementary: this job produces
    # the human-readable diff evidence, the `semver-checks` job enforces
    # the compatibility contract.
    #
    # `cargo-public-api` requires the nightly toolchain to build the
    # rustdoc JSON that backs the listing.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (nightly-2026-07-17)
        # Pinned nightly version. cargo-semver-checks and cargo-public-api
        # both depend on trustfall-rustdoc-adapter to parse rustdoc JSON,
        # and newer nightly toolchains can introduce breaking changes
        # (e.g. removed built-in traits) that cause the adapter to panic.
        # v0.49.0 / v0.52.x were released against nightly-2026-07-17.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-17
      - name: Record resolved nightly toolchain version
        run: rustc --version
      - name: Install cargo-public-api
        # Compatible-range policy: ``~0.52`` allows patch upgrades within
        # the 0.52 minor line; ``--locked`` pins transitive dependencies.
        run: cargo install cargo-public-api --locked --version "~0.52"
      - name: Record resolved cargo-public-api version
        run: cargo public-api --version
      - uses: Swatinem/rust-cache@v2
      - name: Verify Stable-crate public API baseline
        run: python3 scripts/generate_api_baseline.py --verify

  semver-checks:
    name: cargo semver-checks
    # 1.0 freeze: the authoritative SemVer compatibility gate. Unlike
    # `cargo-public-api` (which produces a human-readable text diff for
    # review), `cargo-semver-checks` performs a rigorous lints-based
    # analysis that catches breaking changes that simple text comparison
    # would miss (e.g. tightening trait bounds, deleting enum variants,
    # changing function signatures, removing public fields).
    #
    # The baseline is the most recently published RC (1.0.0-rc.5) on
    # crates.io. The four Stable crates are checked individually:
    #   rill-ml, rill-runtime-protocol, rill-handler-api, rill-runtime
    #
    # `cargo-semver-checks` requires the nightly toolchain to build the
    # rustdoc JSON that backs the analysis.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (nightly-2026-07-17)
        # Pinned nightly version. cargo-semver-checks depends on
        # trustfall-rustdoc-adapter to parse rustdoc JSON, and newer
        # nightly toolchains can introduce breaking changes (e.g. removed
        # built-in traits like RefUnwindSafe/UnwindSafe) that cause the
        # adapter to panic. v0.49.0 was released against nightly-2026-07-17.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-17
      - name: Record resolved nightly toolchain version
        run: rustc --version
      - name: Install cargo-semver-checks
        # Compatible-range policy: ``~0.49`` allows patch upgrades within
        # the 0.49 minor line; ``--locked`` pins transitive dependencies.
        # v0.49+ is required because the workspace uses ``resolver = "3"``
        # (Edition 2024); older versions like 0.35 fail to parse the
        # ``Cargo.toml`` with "unknown variant `3`".
        run: cargo install cargo-semver-checks --locked --version "~0.49"
      - name: Record resolved cargo-semver-checks version
        run: cargo semver-checks --version
      - uses: Swatinem/rust-cache@v2
      - name: Run semver-checks for rill-ml (baseline 1.0.0-rc.5)
        run: cargo semver-checks --package rill-ml --baseline-version 1.0.0-rc.5 --all-features
      - name: Run semver-checks for rill-handler-api (baseline 1.0.0-rc.5)
        run: cargo semver-checks --package rill-handler-api --baseline-version 1.0.0-rc.5
      - name: Run semver-checks for rill-runtime-protocol (baseline 1.0.0-rc.5)
        run: cargo semver-checks --package rill-runtime-protocol --baseline-version 1.0.0-rc.5
      - name: Run semver-checks for rill-runtime (baseline 1.0.0-rc.5)
        run: cargo semver-checks --package rill-runtime --baseline-version 1.0.0-rc.5

  install-smoke:
    name: cargo install default-feature smoke
    # 1.0 freeze: verify that `cargo install rill-runtime` (the documented
    # user-facing install command) succeeds with default features and
    # produces a working binary. This catches regressions where a default
    # feature change breaks the documented install path even when
    # `cargo check` passes.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo install rill-runtime (default features)
        run: cargo install --path crates/rill-runtime --root /tmp/rill-install --locked
      - name: Verify rill-runtime --help works
        run: /tmp/rill-install/bin/rill-runtime --help
      - name: Verify rill-runtime serve --help advertises --handler and --model-trust-key
        run: |
          set -euo pipefail
          output=$(/tmp/rill-install/bin/rill-runtime serve --help)
          echo "$output" | grep -- '--handler'
          echo "$output" | grep -- '--model-trust-key'

  release-index-helpers:
    name: release-index helper tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify model/runtime index update behavior
        run: python3 -m unittest discover -s scripts/tests -v

  state-schema-coverage:
    name: state schema fixture coverage gate
    # 1.0 freeze: validates that every Stable state schema type listed in
    # ``state-schema-manifest.toml`` has full cross-version fixture coverage
    # (v0.13.0 + v1) and implements the declared validation mode
    # (ValidateState / custom Deserialize / derive). This closes the gap
    # between the STABILITY.md state-freeze contract and the actual fixture
    # coverage on disk. Preview types are explicitly listed as not covered.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Stable state schema fixture coverage
        run: python3 scripts/check_state_fixture_coverage.py

  wasm-build:
    name: WASM build + test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p rill-ml-wasm --target wasm32-unknown-unknown
      - name: Install wasm-pack
        # Compatible-range policy: ``~0.13.1`` allows patch upgrades
        # within the 0.13 minor line; ``--locked`` pins transitive
        # dependencies for the install. This is NOT exact pinning —
        # different CI runs may resolve different patch versions when
        # a new patch is published. Avoids the unpinned ``curl | sh``
        # install path in the release chain. Patch upgrades are allowed
        # so security fixes land without a manual bump; review
        # Dependabot alerts before trusting a new minor version with
        # the release pipeline.
        run: cargo install wasm-pack --locked --version "~0.13.1"
      - name: Record resolved wasm-pack version
        run: wasm-pack --version
      - name: wasm-pack test (--node)
        run: cd crates/rill-ml-wasm && wasm-pack test --node --release

  wasm-handler:
    name: WASM handler component build + test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        # Compatible-range policy: ``~1.254.0`` allows patch upgrades
        # within the 1.254 minor line; ``--locked`` pins transitive
        # dependencies for the install. This is NOT exact pinning —
        # different CI runs may resolve different patch versions when
        # a new patch is published. Bump together with the release
        # job's wasm-tools range when upgrading. Patch upgrades are
        # allowed so security fixes land without a manual bump.
        run: cargo install wasm-tools --locked --version "~1.254.0"
      - name: Record resolved wasm-tools version
        run: wasm-tools --version
      - name: Build echo handler component
        run: |
          cd handlers/echo-handler
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p ../../target
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/echo-handler.wasm \
            -o ../../target/echo-handler.wasm
      - name: Build malicious test handler component
        run: |
          cd handlers/test-malicious-handler
          cargo build --release --target wasm32-unknown-unknown
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/test-malicious-handler.wasm \
            -o ../../target/test-malicious-handler.wasm
      - name: Build metadata-loop test handler component
        run: |
          cd handlers/test-metadata-loop-handler
          cargo build --release --target wasm32-unknown-unknown
          wasm-tools component new \
            target/wasm32-unknown-unknown/release/test-metadata-loop-handler.wasm \
            -o ../../target/test-metadata-loop-handler.wasm
      - name: Run WASM handler integration tests
        env:
          ECHO_HANDLER_WASM: ${{ github.workspace }}/target/echo-handler.wasm
          MALICIOUS_HANDLER_WASM: ${{ github.workspace }}/target/test-malicious-handler.wasm
          METADATA_LOOP_HANDLER_WASM: ${{ github.workspace }}/target/test-metadata-loop-handler.wasm
        run: cargo test --locked -p rill-runtime --features wasm --test wasm_handler -- --include-ignored
      - name: Run runtime process integration tests (with WASM)
        env:
          ECHO_HANDLER_WASM: ${{ github.workspace }}/target/echo-handler.wasm
        run: cargo test --locked -p rill-runtime --features wasm --test runtime_process
      - name: Run internal WASM ticker lifecycle tests
        # Fifth-stage 5-A-01/5-A-02: the previous CI flow built the
        # WASM fixtures but only ran the *integration* tests
        # (`--test wasm_handler` / `--test runtime_process`). The
        # internal `#[cfg(test)] mod tests` inside `handler/wasm.rs`
        # — which directly observe the test-only `ACTIVE_EPOCH_TICKERS`
        # counter — were silently skipped because they live behind
        # `--lib` and rely on fixture env vars that the integration
        # tests do not set for them.
        #
        # `RILL_RUN_WASM_FIXTURE_TESTS=1` makes fixture absence a hard
        # failure: if the upstream fixture-build step regressed and
        # produced no `.wasm`, the lifecycle tests panic instead of
        # printing "skipping" and returning success.
        #
        # `-- --exact --nocapture` ensures each lifecycle test name
        # appears verbatim in the CI log so the audit report can cite
        # the workflow run ID + step + test name as evidence.
        env:
          RILL_RUN_WASM_FIXTURE_TESTS: "1"
          ECHO_HANDLER_WASM: ${{ github.workspace }}/target/echo-handler.wasm
          MALICIOUS_HANDLER_WASM: ${{ github.workspace }}/target/test-malicious-handler.wasm
          METADATA_LOOP_HANDLER_WASM: ${{ github.workspace }}/target/test-metadata-loop-handler.wasm
        run: |
          cargo test --locked \
            -p rill-runtime \
            --features wasm \
            --lib \
            handler::wasm::tests::normal_handler_drop_restores_active_ticker_count \
            -- --exact --nocapture

          cargo test --locked \
            -p rill-runtime \
            --features wasm \
            --lib \
            handler::wasm::tests::metadata_loop_failure_restores_active_ticker_count \
            -- --exact --nocapture

          cargo test --locked \
            -p rill-runtime \
            --features wasm \
            --lib \
            handler::wasm::tests::ticker_probe_is_available_to_internal_tests \
            -- --exact --nocapture
      - name: Verify ticker probe is not externally accessible
        # Sixth-stage 6-A-01: the fifth-stage rustdoc grep check only
        # inspects the rendered rustdoc.  Because `#[doc(hidden)] pub`
        # items are not rendered, that grep cannot detect a regression
        # where the probe is re-exposed as `#[doc(hidden)] pub fn
        # active_epoch_ticker_count()`.  This step takes the stricter
        # "external crate" view: a temporary crate that depends on
        # `rill-runtime` via path tries to `use` the probe; the check
        # passes only if that crate FAILS to compile.  A companion
        # smoke crate proves legitimate public API still compiles, so a
        # broken dependency configuration cannot be misread as "probe
        # invisible".
        run: python3 scripts/check_runtime_public_api.py
      - name: rendered-doc smoke check
        # Auxiliary check: confirm the test probe does not appear in the
        # rendered rustdoc.  This is NOT the primary public-API proof
        # (the compile-fail check above is) — it only catches probes
        # that are both `pub` and not `#[doc(hidden)]`.
        run: |
          set -euo pipefail
          cargo doc --locked \
            -p rill-runtime \
            --features wasm \
            --no-deps
          if grep -R -E \
            "active_epoch_ticker_count|ACTIVE_EPOCH_TICKERS" \
            target/doc/rill_runtime; then
            echo "::error::ticker lifecycle test probe leaked into rill-runtime public docs"
            exit 1
          fi
          echo "ticker probe absent from rill-runtime public rustdoc"
      - name: WIT ABI v1 consistency check
        # 1.0 freeze: verify that the four independent declarations of the
        # WIT ABI version agree, and that the normalised WIT source hash
        # matches the frozen value. This catches accidental WIT edits that
        # would silently break handler compatibility without a major bump.
        run: python3 scripts/check_wit_abi.py
      - name: Run prebuilt WIT v1 component compatibility tests
        # 1.0 freeze: verify the current runtime can load a prebuilt
        # component compiled from the v0.13.0 tag using the frozen WIT v1
        # ABI. The fixture (tests/fixtures/handler-v1-component.wasm) is
        # committed and never rebuilt by CI.
        run: cargo test --locked -p rill-runtime --features wasm --test wit_v1_component -- --include-ignored

  python-build:
    name: Python bindings build + pytest
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test Python bindings
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # Install the Python build toolchain.
          # ``requirements-dev.txt`` is the source of truth for the
          # maturin and pytest compatible-range constraints used by CI
          # and release. This is NOT exact pinning — ``pip install``
          # resolves the latest matching patch at install time.
          pip install -r scripts/requirements-dev.txt
          # Record the actually resolved versions for traceability.
          maturin --version
          pytest --version
          cd crates/rill-ml-python
          maturin develop --release
          pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────────────
  # Release jobs — only on workflow_dispatch.
  # Auto Release dispatches this workflow after CI passes; the tag-push
  # trigger is intentionally omitted so retries are idempotent.
  # ─────────────────────────────────────────────────────────────────────────

  package-check:
    name: cargo package dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --exclude rill-ml-python
      - run: cargo package --features serde
      - run: cargo publish --dry-run --features serde

  build-runtime:
    name: Runtime ${{ matrix.target_os }} ${{ matrix.target_arch }}
    if: github.event_name == 'workflow_dispatch'
    needs: package-check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            target_os: linux
            target_arch: x86_64
            extension: ""
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            target_os: windows
            target_arch: x86_64
            extension: .exe
          - runner: macos-14
            rust_target: aarch64-apple-darwin
            target_os: macos
            target_arch: aarch64
            extension: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: runtime-${{ matrix.rust_target }}
      - name: Check Apple signing secrets
        if: matrix.target_os == 'macos'
        id: apple_secrets
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "${APPLE_CERTIFICATE_P12_BASE64:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple Developer ID secrets are not configured. macOS aarch64 runtime will still be built and uploaded, but the binary will be unsigned and not notarized. This is the accepted permanent project policy (see STABILITY.md § macOS unsigned policy). Configure APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY in the repository secrets to enable optional codesign."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build runtime (with wasm feature for handler support)
        run: cargo build --locked --release --target ${{ matrix.rust_target }} -p rill-runtime --bin rill-runtime --features wasm
      - name: Import Apple Developer ID certificate
        if: matrix.target_os == 'macos' && steps.apple_secrets.outputs.has_secrets == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path("certificate.p12").write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"]))
          PY
          security create-keychain -p "${RUNNER_TEMP}" rill-signing.keychain-db
          security set-keychain-settings -lut 21600 rill-signing.keychain-db
          security unlock-keychain -p "${RUNNER_TEMP}" rill-signing.keychain-db
          security import certificate.p12 -k rill-signing.keychain-db -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s rill-signing.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${RUNNER_TEMP}" rill-signing.keychain-db
      - name: Code-sign macOS runtime
        if: matrix.target_os == 'macos' && steps.apple_secrets.outputs.has_secrets == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "target/${{ matrix.rust_target }}/release/rill-runtime"
          codesign --verify --strict --verbose=2 "target/${{ matrix.rust_target }}/release/rill-runtime"
      - name: Mark unsigned macOS asset
        # Permanent project policy: macOS aarch64 runtime is always built
        # and uploaded. When Apple Developer ID secrets are absent, the
        # binary is unsigned and not notarized. This step writes a
        # sidecar metadata file so the release index and release notes
        # can accurately reflect the unsigned status without modifying
        # the frozen release-index schema.
        if: matrix.target_os == 'macos' && steps.apple_secrets.outputs.has_secrets == 'false'
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist
          cat > "dist/rill-runtime-${version}-macos-aarch64.unsigned.json" <<EOF
          {
            "artifact": "rill-runtime-${version}-macos-aarch64",
            "platform": "macos",
            "arch": "aarch64",
            "version": "${version}",
            "codeSigning": "unsigned",
            "notarization": false,
            "reason": "Apple Developer ID Application certificate is not configured. This is the accepted permanent project policy (see STABILITY.md § macOS unsigned policy). The binary is still functional; macOS users may need to bypass Gatekeeper via Finder right-click → Open or System Settings → Privacy & Security → Allow."
          }
          EOF
          echo "macOS aarch64 runtime will be uploaded as unsigned (not notarized)."
      - name: Stage asset
        shell: python
        env:
          VERSION: ${{ env.RELEASE_TAG }}
          TARGET: ${{ matrix.rust_target }}
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          import os, pathlib, shutil
          version = os.environ["VERSION"].removeprefix("v")
          extension = os.environ["EXTENSION"]
          source = pathlib.Path("target") / os.environ["TARGET"] / "release" / f"rill-runtime{extension}"
          output = pathlib.Path("dist") / f"rill-runtime-{version}-{os.environ['TARGET_OS']}-{os.environ['TARGET_ARCH']}{extension}"
          output.parent.mkdir(exist_ok=True)
          shutil.copyfile(source, output)
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/rill-runtime-*
          if-no-files-found: error

  publish:
    name: Sign and publish
    if: github.event_name == 'workflow_dispatch'
    needs: build-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Accept both stable (v1.0.0) and prerelease (v1.0.0-rc.1) SemVer
          # tags. The prerelease suffix is required for candidate-channel
          # routing: a version containing a hyphen publishes to the
          # candidate pointer and never updates the stable pointer.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)" = "$version"
          test "$(python3 -c 'import json; print(json.load(open("models/example-default/manifest.json"))["version"])')" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # SemVer 2.0: a prerelease version contains a hyphen after the
          # patch number (e.g. 1.0.0-rc.1). Stable versions do not.
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=candidate" >> "$GITHUB_OUTPUT"
            echo "index_file=candidate-index.json" >> "$GITHUB_OUTPUT"
            echo "pointer_release=local-ai-candidate" >> "$GITHUB_OUTPUT"
            echo "pointer_title=Rill Local AI candidate index" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "index_file=stable-index.json" >> "$GITHUB_OUTPUT"
            echo "pointer_release=local-ai-stable" >> "$GITHUB_OUTPUT"
            echo "pointer_title=Rill Local AI stable index" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signing tool
        run: cargo build --locked --release -p rill-runtime --bin rill-pack
      - name: Publish Stable crates to crates.io (driven by release-plan.toml)
        # 1.0 freeze: the publish list is driven entirely by
        # ``release-plan.toml``.  Only the Stable group is published; Preview
        # crates are never published by an RC tag and must not appear in the
        # loop.  This replaces the previous hardcoded list that included
        # Preview crates and relied on crates.io returning "already exists"
        # to skip them — that behaviour violated the release plan contract.
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Validate the release plan and emit the Stable publish order.
          # ``--tag`` validates that the Stable version matches the release tag.
          mapfile -t stable_crates < <(python3 scripts/parse_release_plan.py --list-stable --tag "$RELEASE_TAG")
          if [ "${#stable_crates[@]}" -eq 0 ]; then
            echo "::error::release-plan.toml [stable] has an empty crates list"
            exit 1
          fi
          echo "Publishing ${#stable_crates[@]} Stable crates (driven by release-plan.toml):"
          printf '  - %s\n' "${stable_crates[@]}"
          for crate in "${stable_crates[@]}"; do
            published=false
            for attempt in {1..10}; do
              if output=$(cargo publish -p "$crate" --no-verify 2>&1); then
                echo "$output"
                published=true
                break
              fi
              if echo "$output" | grep -q "already exists"; then
                echo "$crate already published, continuing"
                published=true
                break
              elif echo "$output" | grep -Eq "failed to select a version|no matching package named" && [ "$attempt" -lt 10 ]; then
                echo "Waiting for crates.io to index dependencies before publishing $crate (attempt $attempt/10)"
                sleep 15
              else
                echo "$output"
                exit 1
              fi
            done
            if [ "$published" != true ]; then
              echo "Timed out waiting to publish $crate"
              exit 1
            fi
          done
          # Verify that Preview crates were NOT published by this RC tag.
          mapfile -t preview_crates < <(python3 scripts/parse_release_plan.py --list-preview)
          echo "Preview crates (NOT published by this RC tag):"
          printf '  - %s\n' "${preview_crates[@]}"
      - name: Verify existing channel index when present
        env:
          GH_TOKEN: ${{ github.token }}
          POINTER_RELEASE: ${{ steps.version.outputs.pointer_release }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          # Download the existing index from the channel-appropriate pointer
          # release (local-ai-stable for stable, local-ai-candidate for
          # prerelease). The downloaded file is used as the merge base so a
          # newer model/handler from a prior release in the same channel is
          # retained. A candidate release never reads or writes the stable
          # pointer.
          if gh release download "$POINTER_RELEASE" --pattern "$INDEX_FILE" --dir dist; then
            mv "dist/$INDEX_FILE" dist/current-index.json
            if ! target/release/rill-pack verify-index \
              --index dist/current-index.json \
              --key-id "$PUBLISHER_KEY_ID" \
              --public-key-hex "$RILL_PUBLIC_KEY_HEX"; then
              echo "::warning::Existing $INDEX_FILE could not be verified (possibly incompatible schema). Treating as fresh release."
              rm -f dist/current-index.json
            fi
          fi
      - name: Reuse immutable versioned assets when present
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" \
              --pattern 'rill-runtime-*' \
              --pattern '*.rillpack' \
              --pattern '*.rillhandler' \
              --dir dist \
              --clobber
            mkdir -p dist/versioned-release
            gh release download "$RELEASE_TAG" \
              --pattern "$INDEX_FILE" \
              --dir dist/versioned-release \
              --clobber || true
            if [ -f "dist/versioned-release/$INDEX_FILE" ] && target/release/rill-pack verify-index \
              --index "dist/versioned-release/$INDEX_FILE" \
              --key-id "$PUBLISHER_KEY_ID" \
              --public-key-hex "$RILL_PUBLIC_KEY_HEX"; then
              python3 scripts/verify-release-assets.py \
                --index "dist/versioned-release/$INDEX_FILE" \
                --release-dir dist \
                --version "$VERSION"
            else
              echo "::warning::Versioned $INDEX_FILE could not be verified (possibly incompatible schema or first release in channel). Skipping asset-matching check; individual assets are still verified in the next step."
            fi
          fi
      - name: Create signed model package
        env:
          RILL_SIGNING_KEY_HEX: ${{ secrets.RILL_SIGNING_KEY_HEX }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RILL_SIGNING_KEY_HEX"
          if [ ! -f "dist/example-default-${VERSION}.rillpack" ]; then
            target/release/rill-pack create \
              --manifest models/example-default/manifest.json \
              --model models/example-default/model.json \
              --output "dist/example-default-${VERSION}.rillpack"
          fi
      - name: Install wasm-tools
        # Compatible-range policy: matches the CI build in the
        # ``wasm-handler`` job. ``~1.254.0`` allows patch upgrades
        # within the 1.254 minor line; ``--locked`` pins transitive
        # dependencies for the install. This is NOT exact pinning —
        # different release runs may resolve different patch versions
        # when a new patch is published.
        run: cargo install wasm-tools --locked --version "~1.254.0"
      - name: Record resolved wasm-tools version
        run: wasm-tools --version
      - name: Build and sign echo handler package
        env:
          RILL_SIGNING_KEY_HEX: ${{ secrets.RILL_SIGNING_KEY_HEX }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RILL_SIGNING_KEY_HEX"
          if [ ! -f "dist/echo-handler-${VERSION}.rillhandler" ]; then
            cd handlers/echo-handler
            cargo build --release --target wasm32-unknown-unknown
            mkdir -p ../../target
            wasm-tools component new \
              target/wasm32-unknown-unknown/release/echo-handler.wasm \
              -o ../../target/echo-handler.wasm
            cd ../..
            target/release/rill-pack create-handler \
              --manifest handlers/echo-handler/manifest.json \
              --module target/echo-handler.wasm \
              --output "dist/echo-handler-${VERSION}.rillhandler"
          fi
      - name: Build and sign release index
        env:
          RILL_SIGNING_KEY_HEX: ${{ secrets.RILL_SIGNING_KEY_HEX }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          extra=()
          if [ -f dist/current-index.json ]; then
            extra+=(--existing-index dist/current-index.json)
          fi
          python3 scripts/build-release-index.py \
            --release-dir dist \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --publisher-key-id "$PUBLISHER_KEY_ID" \
            --generated-at "$generated_at" \
            --channel "$CHANNEL" \
            --output dist/index-payload.json \
            "${extra[@]}"
          target/release/rill-pack sign-index \
            --payload dist/index-payload.json \
            --output "dist/$INDEX_FILE"
      - name: Verify signed outputs before publishing
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
        shell: bash
        run: |
          set -euo pipefail
          target/release/rill-pack verify \
            --pack "dist/example-default-${VERSION}.rillpack" \
            --key-id "$PUBLISHER_KEY_ID" \
            --public-key-hex "$RILL_PUBLIC_KEY_HEX"
          target/release/rill-pack inspect-handler \
            --handler "dist/echo-handler-${VERSION}.rillhandler" \
            --key-id "$PUBLISHER_KEY_ID" \
            --public-key-hex "$RILL_PUBLIC_KEY_HEX"
          target/release/rill-pack verify-index \
            --index "dist/$INDEX_FILE" \
            --key-id "$PUBLISHER_KEY_ID" \
            --public-key-hex "$RILL_PUBLIC_KEY_HEX"
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mapfile -t existing_assets < <(
              gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
            )
            for asset in dist/rill-runtime-* dist/*.rillpack dist/*.rillhandler "dist/$INDEX_FILE"; do
              name="$(basename "$asset")"
              present=false
              for existing in "${existing_assets[@]}"; do
                if [ "$existing" = "$name" ]; then
                  present=true
                  break
                fi
              done
              if [ "$present" = true ]; then
                echo "Preserving immutable asset $name"
              else
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" dist/rill-runtime-* dist/*.rillpack dist/*.rillhandler "dist/$INDEX_FILE" \
              --verify-tag \
              --title "Rill ML ${{ steps.version.outputs.version }}" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
      - name: Move signed index pointer
        env:
          GH_TOKEN: ${{ github.token }}
          POINTER_RELEASE: ${{ steps.version.outputs.pointer_release }}
          POINTER_TITLE: ${{ steps.version.outputs.pointer_title }}
          INDEX_FILE: ${{ steps.version.outputs.index_file }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # Route the signed index to the channel-appropriate pointer
          # release. A prerelease (candidate) version updates only
          # local-ai-candidate and never touches local-ai-stable; a stable
          # version updates only local-ai-stable. The two channels are
          # intentionally independent so users tracking the stable pointer
          # never see an RC version appear.
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Prerelease detected: updating candidate pointer only (local-ai-stable is untouched)."
          else
            echo "Stable release detected: updating stable pointer only (local-ai-candidate is untouched)."
          fi
          gh release view "$POINTER_RELEASE" >/dev/null 2>&1 || \
            gh release create "$POINTER_RELEASE" --title "$POINTER_TITLE" --notes "Machine-readable signed update index."
          gh release upload "$POINTER_RELEASE" "dist/$INDEX_FILE" --clobber

  publish-python:
    name: Publish Python bindings to PyPI
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check whether Python version matches the release tag
        id: python_version_check
        shell: bash
        run: |
          set -euo pipefail
          # The Python crate is in the Preview version group and may carry a
          # different version from the Stable group (the tag version). Only
          # publish to PyPI when the two match; otherwise the job would try
          # to re-upload an already-published Preview version and fail the
          # visibility check against the wrong version. The 1.0 RC cycle
          # (Stable=1.0.0-rc.x, Preview=0.13.0) skips PyPI entirely; the
          # Python crate is not a 1.0 blocking artifact (see STABILITY.md).
          tag_version="${RELEASE_TAG#v}"
          python_version="$(python3 -c 'import tomllib; print(tomllib.loads(open("crates/rill-ml-python/pyproject.toml","rb").read().decode())["project"]["version"])')"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"
          if [ "$tag_version" = "$python_version" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Python version ($python_version) matches tag ($tag_version); will publish."
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Python version ($python_version) differs from tag ($tag_version); skipping PyPI publish (Preview crate is not a 1.0 blocking artifact)."
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.python_version_check.outputs.should_publish == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.python_version_check.outputs.should_publish == 'true'
      - name: Install Python build toolchain (compatible range)
        if: steps.python_version_check.outputs.should_publish == 'true'
        # ``requirements-dev.txt`` is the source of truth for the
        # maturin and pytest compatible-range constraints used by both
        # CI and release. This is NOT exact pinning — ``pip install``
        # resolves the latest matching patch at install time. CI runs
        # on different days may pick different patch versions.
        run: |
          pip install -r scripts/requirements-dev.txt
          # Record the actually resolved versions for release traceability.
          maturin --version
          pytest --version
      - name: Verify PyPI token is configured
        if: steps.python_version_check.outputs.should_publish == 'true'
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MATURIN_PYPI_TOKEN:-}" ]; then
            echo "::error::MATURIN_PYPI_TOKEN is not configured. Python bindings are part of the official release (see README §模块总览); a missing token must fail the release rather than silently skipping. Add the secret to the repository or remove this job if Python support is being dropped."
            exit 1
          fi
      - name: maturin publish
        if: steps.python_version_check.outputs.should_publish == 'true'
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
        working-directory: crates/rill-ml-python
        run: maturin publish --no-sdist
      - name: Verify PyPI release is visible
        if: steps.python_version_check.outputs.should_publish == 'true'
        env:
          PYTHON_VERSION: ${{ steps.python_version_check.outputs.python_version }}
        run: |
          set -euo pipefail
          version="$PYTHON_VERSION"
          # PyPI's JSON API may lag a few seconds behind the upload. Retry
          # for up to a minute before reporting the publish as failed.
          package="rill-ml-python"
          for attempt in $(seq 1 12); do
            if python3 -c "
          import json, urllib.request
          url = 'https://pypi.org/pypi/${package}/${version}/json'
          with urllib.request.urlopen(url, timeout=10) as response:
              json.load(response)
          "; then
              echo "PyPI release ${package}==${version} is visible."
              exit 0
            fi
            echo "PyPI release not visible yet (attempt $attempt/12); retrying in 5s..."
            sleep 5
          done
          echo "::error::PyPI release ${package}==${version} was not visible after 60s. Investigate https://pypi.org/project/${package}/${version}/ before announcing the release."
          exit 1
