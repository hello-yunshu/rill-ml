name: Cross-Platform Verification
run-name: Cross-platform verification (${{ github.ref }})

on:
  push:
    branches: [main, master, 'release/**']
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "handlers/**"
      - "models/**"
      - "Dockerfile*"
      - "scripts/**"
      - "smoke-test/**"
      - ".github/workflows/**"
      - "release-plan.toml"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "handlers/**"
      - "models/**"
      - "Dockerfile*"
      - "scripts/**"
      - "smoke-test/**"
      - ".github/workflows/**"
      - "release-plan.toml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Native GNU Stable Gates (no QEMU, no Docker). The Actions host CPU is the
  # target CPU, so the crate tests + released Runtime build and run directly.
  # ────────────────────────────────────────────────────────────────────────
  linux-x86_64-gnu:
    name: Linux x86_64 Stable Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          # The native GNU gates run `cargo fmt` and `cargo clippy` inside
          # qemu-cross-gate.sh, so rustfmt + clippy must be installed here.
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-x86_64-gnu
      - name: Native x86_64 GNU gate (fmt / clippy / test / doc / runtime smoke)
        run: ./scripts/qemu-cross-gate.sh x86_64-unknown-linux-gnu

  linux-aarch64-gnu:
    name: Linux ARM64 Stable Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          # The native GNU gates run `cargo fmt` and `cargo clippy` inside
          # qemu-cross-gate.sh, so rustfmt + clippy must be installed here.
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-aarch64-gnu
      - name: Native ARM64 GNU gate (test / doc / runtime smoke)
        env:
          # The executable ARM64 runner exercises the same backend policy as
          # OHOS without claiming HarmonyOS device execution. This flag is
          # compile-time only and is never set by release builds.
          RILL_TEST_PULLEY64: "1"
        run: ./scripts/qemu-cross-gate.sh aarch64-unknown-linux-gnu

  ohos-aarch64-source:
    name: OHOS ARM64 source/build qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install OHOS SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev
      - name: Restore OHOS SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ohos-sdk
          key: ohos-sdk-${{ runner.os }}-${{ runner.arch }}-6.1.1.280
      - name: Set up official HarmonyOS/OpenHarmony SDK
        uses: ErBWs/setup-ohos@4dbb63025116eb6165ceac58a4bf47cbdc5ac721 # v2
        with:
          # HarmonyOS SDK 6.1.1.125 / API 24 Release; CLI tools 6.1.1.280.
          version: 6.1.1.280
          cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          targets: aarch64-unknown-linux-ohos
      - name: Build Full Runtime with official OHOS SDK
        run: bash scripts/ohos-build.sh dist/rill-runtime-ohos-aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ohos-runtime-qualification
          path: dist/rill-runtime-ohos-aarch64
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  # Native musl Stable Gates (no container). musl-tools provides the host-arch
  # musl-gcc so the Rust musl triple links and real-executes on the host CPU.
  # ────────────────────────────────────────────────────────────────────────
  linux-x86_64-musl:
    name: Linux x86_64 musl Stable Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-x86_64-musl
      - name: Build + execute x86_64 musl Runtime
        run: ./scripts/musl-gate.sh x86_64-unknown-linux-musl

  linux-aarch64-musl:
    name: Linux ARM64 musl Stable Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-aarch64-musl
      - name: Build + execute ARM64 musl Runtime
        run: ./scripts/musl-gate.sh aarch64-unknown-linux-musl

  # ────────────────────────────────────────────────────────────────────────
  # RISC-V64 Stable Gate — Actions host + official Rust recommended QEMU
  # user-mode + Debian cross toolchain. Direct QEMU, no Docker, no reliance on
  # an upstream rust:* linux/riscv64 image manifest. Runs the real --all-features
  # test suite (incl. real WASM handler invoke via the Pulley backend) AND the
  # full default Runtime (wasm feature) under QEMU.
  # ────────────────────────────────────────────────────────────────────────
  riscv64-gnu:
    name: RISC-V64 Stable Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: riscv64-gnu
      - name: RISC-V64 direct QEMU gate (test + runtime + WASM handler)
        run: ./scripts/qemu-cross-gate.sh riscv64gc-unknown-linux-gnu

  # ────────────────────────────────────────────────────────────────────────
  # LoongArch64 Stable Gate — pinned, checksum-verified LoongArch GNU cross
  # toolchain + direct qemu-loongarch64 user-mode. No Docker manifest needed.
  # Toolchain is cached so CIs don't re-download and re-extract a ~75 MB tarball.
  # ────────────────────────────────────────────────────────────────────────
  loongarch64-gnu:
    name: LoongArch64 Stable Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          targets: loongarch64-unknown-linux-gnu
      - name: Cache pinned LoongArch cross toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.rillml-loongarch-toolchain
          key: loongarch-toolchain-20260812-latest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: loongarch64-gnu
      - name: LoongArch64 direct QEMU gate (test + runtime + Pulley WASM handler)
        run: ./scripts/loongarch-cross-gate.sh

  # ────────────────────────────────────────────────────────────────────────
  # Direct user-mode QEMU gates for the remaining non-native GNU targets.
  # armv7 / s390x / powerpc64le are Core Supported only. Their release
  # investigation assets are built with the default feature set, but the source
  # smoke below deliberately proves only the Core surface because the previous
  # --no-default-features Runtime smoke cannot qualify the Full Runtime.
  # ────────────────────────────────────────────────────────────────────────
  direct-qemu-gnu:
    name: Direct QEMU gate (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            runtime_smoke: 0
          - target: s390x-unknown-linux-gnu
            runtime_smoke: 0
          - target: powerpc64le-unknown-linux-gnu
            runtime_smoke: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: direct-qemu-${{ matrix.target }}
      - name: Direct QEMU gate on ${{ matrix.target }}
        env:
          # These Core-only targets deliberately run the all-features source
          # tests but do not claim a Full Runtime execute path. In particular,
          # a no-default-features binary cannot load the WASM handler fixture.
          RUNTIME_SMOKE: ${{ matrix.runtime_smoke }}
        run: ./scripts/qemu-cross-gate.sh "${{ matrix.target }}"

  # ────────────────────────────────────────────────────────────────────────
  # WASM bindings gate. Docker is retained here deliberately (GitHub
  # Actions-first leaves Docker "where it genuinely lowers complexity"): the
  # WASM toolchain needs a pinned Node.js LTS that the base runner image does
  # not guarantee. Builds the publishable npm layout + runs wasm-bindgen tests.
  # ────────────────────────────────────────────────────────────────────────
  wasm-bindings-gate:
    name: WASM bindings Stable Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up QEMU / binfmt_misc
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          # Avoid the shared binfmt cache reservation race with concurrent
          # workflow runs; the setup cost is small for this single WASM gate.
          cache-image: false
      - name: Run WASM build + test
        run: ./scripts/docker-wasm-build.sh

  # ────────────────────────────────────────────────────────────────────────
  # Android FFI bonus-arch gate. Cross-building the Android NDK staticlibs is a
  # labeled, pinned NDK stack, and Docker makes the belt-and-suspenders NDK
  # setup reproducible. Arm aarch64/x86_64 Android stays Not listed (real
  # on-device execution is the emulator/device path).
  # ────────────────────────────────────────────────────────────────────────
  android-ffi:
    name: Android FFI cross-build (NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Android FFI cross-build (aarch64 + x86_64, JNI shim)
        run: ./scripts/docker-build-android.sh

  # ────────────────────────────────────────────────────────────────────────
  # iOS FFI XCFramework build on a native macOS runner. iOS has no Docker; the
  # native macOS/Xcode toolchain is the accepted verification path.
  # ────────────────────────────────────────────────────────────────────────
  ios-ffi:
    name: iOS FFI XCFramework build (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: iOS FFI XCFramework build (device + simulator)
        run: ./scripts/build-ios-framework.sh

  # ────────────────────────────────────────────────────────────────────────
  # FreeBSD x86_64 — real kernel verification via a FreeBSD VM. Docker/QEMU
  # kernel-vs-userspace semantics cannot substitute the FreeBSD kernel, so a
  # VM is the correct escalation tier. FreeBSD is Full Runtime Supported via
  # this native execution gate.
  # ────────────────────────────────────────────────────────────────────────
  freebsd-ci:
    name: FreeBSD x86_64 Stable Gate (VM)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: FreeBSD native CI (fmt / clippy / test / runtime smoke)
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          usesh: true
          # The VM gate is behavioral evidence only. Copying the entire
          # Actions workspace back over the vmactions transport can fail after
          # the guest has already printed a passing result and is not required
          # by this job.
          copyback: false
          prepare: |
            pkg install -y rust python3 bash
          run: ./scripts/freebsd-ci.sh
