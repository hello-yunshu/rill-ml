name: Cross-Platform Docker / QEMU
run-name: Cross-platform Docker / QEMU execution

on:
  push:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "Dockerfile*"
      - "scripts/**"
      - ".github/workflows/cross-platform.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "Dockerfile*"
      - "scripts/**"
      - ".github/workflows/cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Docker native x86_64 GNU gate — the Docker-first single entry point.
  # ─────────────────────────────────────────────────────────────────────────
  native-gate:
    name: Native Linux x86_64 gate (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Run full quality gate in Docker (x86_64 GNU)
        run: ./scripts/docker-test.sh

  # ─────────────────────────────────────────────────────────────────────────
  # Docker WASM bindings gate — the Docker-first canonical gate for
  # crates/rill-ml-wasm. Builds the publishable npm layout (pkg/ web ESM +
  # pkg-node/ Node CJS) and runs the wasm-bindgen test suite under a pinned
  # Node.js LTS inside the container. This is the same script the native CI
  # job (pipeline.yml -> wasm-build) executes on the host.
  # ─────────────────────────────────────────────────────────────────────────
  wasm-bindings-gate:
    name: WASM bindings gate (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU / binfmt_misc
        uses: docker/setup-qemu-action@v4
      - name: Run WASM build + test in Docker
        run: ./scripts/docker-wasm-build.sh

  # ─────────────────────────────────────────────────────────────────────────
  # Docker cross-architecture execution via QEMU/binfmt.
  # Each job real-executes the target-arch test binaries (not compile-only).
  # ─────────────────────────────────────────────────────────────────────────
  cross-exec:
    name: QEMU cross-arch execute (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          # loongarch64 is included for continuous coverage. On hosts without
          # a usable linux/loongarch64 image manifest the script exits cleanly
          # (exit 0) and LoongArch64 stays compile/evaluation-only — never
          # claimed Supported without real execution (see cross-exec-test.sh
          # and PLATFORM_SUPPORT.md).
          - loongarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU / binfmt_misc
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Cache cargo registry (QEMU compile is slow)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cross-exec-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cross-exec-cargo-${{ matrix.target }}-
            cross-exec-cargo-
      - name: Real-execute test suite on ${{ matrix.target }}
        run: |
          args=""
          case "${{ matrix.target }}" in
            # These targets are Supported: they must also pass the full Runtime
            # smoke (release build, signed pack -> verify -> inspect -> IPC),
            # not just the crate test suite. armv7/riscv64/s390x/powerpc64le
            # run real QEMU execution; loongarch64 is guarded in the script and
            # skips cleanly when no usable image manifest exists.
            armv7-unknown-linux-gnueabihf|riscv64gc-unknown-linux-gnu|s390x-unknown-linux-gnu|powerpc64le-unknown-linux-gnu|loongarch64-unknown-linux-gnu) args="--runtime-smoke" ;;
          esac
          ./scripts/cross-exec-test.sh "${{ matrix.target }}" $args

  # ─────────────────────────────────────────────────────────────────────────
  # Docker release/smoke — build + execute released-style artifacts on Linux
  # GNU and musl x86_64/ARM64.
  # ─────────────────────────────────────────────────────────────────────────
  release-smoke:
    name: Release smoke (Docker, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU / binfmt_misc
        if: contains(matrix.target, 'aarch64')
        uses: docker/setup-qemu-action@v4
      - name: Docker release smoke on ${{ matrix.target }}
        run: TARGET="${{ matrix.target }}" ./scripts/docker-release-smoke.sh

  # ─────────────────────────────────────────────────────────────────────────
  # Android FFI cross-build via Docker NDK (Phase 6b).
  # Runs on the amd64 host natively (the toolchain image is linux/amd64).
  # Builds + architecture-verifies the rill-ml-ffi staticlibs/cdylibs for
  # aarch64 and x86_64 Android, and compiles+links the JNI shim against the
  # fresh staticlib. This is a build + artifact-verification gate; real
  # on-device execution remains the Android emulator/device path, so Android
  # is NOT yet claimed Supported (see PLATFORM_SUPPORT.md).
  # ─────────────────────────────────────────────────────────────────────────
  android-ffi:
    name: Android FFI cross-build (Docker NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Android FFI cross-build (aarch64 + x86_64, JNI shim)
        run: ./scripts/docker-build-android.sh

  # ─────────────────────────────────────────────────────────────────────────
  # iOS FFI XCFramework build on a native macOS runner (Phase 6b).
  # iOS has no Docker image, so the native macOS/Xcode toolchain is the
  # accepted verification path. Builds + verifies RillMl.xcframework and
  # CRillMl.xcframework for device + simulator slices. Real on-device
  # execution remains the simulator/device path, so iOS is NOT yet claimed
  # Supported (see PLATFORM_SUPPORT.md).
  # ─────────────────────────────────────────────────────────────────────────
  ios-ffi:
    name: iOS FFI XCFramework build (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: iOS FFI XCFramework build (device + simulator)
        run: ./scripts/build-ios-framework.sh

  # ─────────────────────────────────────────────────────────────────────────
  # musl runtime targets: real-execute inside a container whose platform
  # matches the target (QEMU/binfmt for aarch64musl). musl-tools inside the
  # target-arch container provides the NATIVE <arch>-linux-musl-gcc, so these
  # binaries genuinely link musl and run — not a host x86_64 musl-gcc masquerade.
  # Each target also runs the full Runtime smoke (release build, --help, signed
  # pack -> verify -> inspect -> IPC handshake) via --runtime-smoke.
  # ─────────────────────────────────────────────────────────────────────────
  musl-execute:
    name: musl real-execute (Docker, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU / binfmt_misc
        if: contains(matrix.target, 'aarch64')
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: contains(matrix.target, 'aarch64')
        uses: docker/setup-buildx-action@v4
      - name: Cache cargo registry (QEMU compile is slow)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: musl-exec-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            musl-exec-cargo-${{ matrix.target }}-
            musl-exec-cargo-
      - name: Real-execute workspace tests + runtime smoke on ${{ matrix.target }}
        run: ./scripts/cross-exec-test.sh "${{ matrix.target }}" --runtime-smoke

  # ─────────────────────────────────────────────────────────────────────────
  # FreeBSD native CI (Phase 7: x86_64-unknown-freebsd).
  # Docker/QEMU cannot substitute the FreeBSD kernel, so real execution-level
  # verification must run on a real FreeBSD host. vmactions/freebsd-vm boots a
  # FreeBSD VM on the ubuntu runner and syncs the workspace into it;
  # scripts/freebsd-ci.sh then runs the native gate (fmt/clippy, full
  # workspace test suite, Runtime smoke with a fresh-key signed pack + IPC
  # handshake). FreeBSD is NOT yet claimed Supported — this job is the native
  # execution verification gate (see PLATFORM_SUPPORT.md "Not Listed").
  # ─────────────────────────────────────────────────────────────────────────
  freebsd-ci:
    name: FreeBSD native (x86_64) CI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: FreeBSD native CI (fmt / clippy / test / runtime smoke)
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust python3 bash
          run: ./scripts/freebsd-ci.sh