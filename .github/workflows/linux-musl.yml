name: Linux musl Stable

on:
  push:
    branches: [main, master, 'release/**']
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "handlers/**"
      - "models/**"
      - "scripts/**"
      - "platform-support.toml"
      - ".github/workflows/**"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "handlers/**"
      - "models/**"
      - "scripts/**"
      - "platform-support.toml"
      - ".github/workflows/**"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  musl-target:
    name: Linux musl Stable (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - i686-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Install Zig musl linker
        uses: xyzzylabs/setup-zig@2082e552e19803253444ed0f0124948d16e9a926 # v1
        with:
          cache-key: ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo
          key: linux-musl-${{ matrix.target }}
      - name: Run Core and Full Runtime gate
        run: bash scripts/musl-cross-gate.sh "${{ matrix.target }}"
