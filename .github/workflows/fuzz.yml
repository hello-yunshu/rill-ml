name: Fuzz

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/rill-runtime/**"
      - "crates/rill-runtime-protocol/**"
      - "src/**"
  push:
    branches: [main, master, 'release/**']
    paths:
      - "fuzz/**"
      - "crates/rill-runtime/**"
      - "crates/rill-runtime-protocol/**"
      - "src/**"
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: bounded fuzz smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "0.12.0"
      - name: Run bounded corpus smoke
        shell: bash
        run: |
          set -euo pipefail
          targets=(archive handler release_index trust_metadata ipc_v1_v2 ipc_v3_preview snapshot handler_json_output)
          for target in "${targets[@]}"; do
            (cd fuzz && cargo fuzz run "$target" --sanitizer none -- -runs=100)
          done

  scheduled:
    name: scheduled extended fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-11-05
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "0.12.0"
      - name: Run extended fuzz campaign
        shell: bash
        run: |
          set -euo pipefail
          targets=(archive handler release_index trust_metadata ipc_v1_v2 ipc_v3_preview snapshot handler_json_output)
          for target in "${targets[@]}"; do
            (cd fuzz && cargo fuzz run "$target" --sanitizer none -- -runs=10000)
          done
      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 14
