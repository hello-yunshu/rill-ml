name: Fuzz

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/rill-runtime/**"
      - "crates/rill-runtime-protocol/**"
      - "src/**"
  push:
    branches: [main, master]
    paths:
      - "fuzz/**"
      - "crates/rill-runtime/**"
      - "crates/rill-runtime-protocol/**"
      - "src/**"
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: bounded fuzz smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "0.12.0"
      - name: Run bounded corpus smoke
        shell: bash
        run: |
          set -euo pipefail
          targets=(archive handler release_index trust_metadata ipc_v1_v2 ipc_v3_preview snapshot handler_json_output)
          for target in "${targets[@]}"; do
            (cd fuzz && cargo fuzz run "$target" --sanitizer none -- -runs=100)
          done

  scheduled:
    name: scheduled extended fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "0.12.0"
      - name: Run extended fuzz campaign
        shell: bash
        run: |
          set -euo pipefail
          targets=(archive handler release_index trust_metadata ipc_v1_v2 ipc_v3_preview snapshot handler_json_output)
          for target in "${targets[@]}"; do
            (cd fuzz && cargo fuzz run "$target" --sanitizer none -- -runs=10000)
          done
      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 14
