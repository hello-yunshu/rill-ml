name: SBOM release verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify published SBOM identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Download published SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --pattern 'rill-ml-*.cdx.json' --dir dist
          gh release download "${{ inputs.tag }}" --pattern 'rill-ml-*.spdx.json' --dir dist
      - name: Verify release-bound identity and checksums
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          python3 scripts/verify_sbom.py \
            --cdx "dist/rill-ml-${version}.cdx.json" \
            --spdx "dist/rill-ml-${version}.spdx.json" \
            --version "$version" \
            --tag "$VERSION" \
            --commit "$(git rev-parse HEAD)"
      - name: Install pinned standard SBOM validators
        run: |
          python3 -m pip install --disable-pip-version-check -r scripts/requirements-sbom.txt
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.29.0/cyclonedx-linux-x64"
          echo "411bd30d28ca705500f0b5a7f4a896749cad1b082deb5245ece7b386e496c48c  $RUNNER_TEMP/cyclonedx" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/cyclonedx"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate SBOMs against CycloneDX and SPDX standards
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          cyclonedx validate \
            --input-file "dist/rill-ml-${version}.cdx.json" \
            --input-format json \
            --input-version 1.5
          python3 scripts/validate_sbom_standards.py \
            --spdx "dist/rill-ml-${version}.spdx.json"
