[package]
name = "rill-ml-tokio"
# Preview crate: stays at 0.x per release-plan.toml while Stable crates advance to 1.0.
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tokio Stream adapters for RillML progressive evaluation."

[dependencies]
rill-ml = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lib]
name = "rill_ml_tokio"
path = "src/lib.rs"

[[example]]
name = "stream_demo"
