[package]
name = "rill-ml-python"
# Preview crate: stays at 0.x per release-plan.toml while Stable crates advance to 1.0.
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for RillML via PyO3."

[lib]
name = "rill_ml_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
rill-ml = { workspace = true, features = ["serde"] }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
