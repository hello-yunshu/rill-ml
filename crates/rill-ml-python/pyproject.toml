[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rill-ml-python"
version = "0.15.0"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# abi3-py39 produces a single stable-ABI wheel that works on any CPython 3.9+,
# so one wheel per platform covers every supported interpreter version instead
# of building one wheel per minor version. requires-python stays >=3.9.
[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
module-name = "rill_ml"
