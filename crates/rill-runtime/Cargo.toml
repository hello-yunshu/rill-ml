[package]
name = "rill-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Signed-model local runtime and IPC server for RillML."

[lib]
name = "rill_runtime"
path = "src/lib.rs"

[[bin]]
name = "rill-runtime"
path = "src/bin/rill-runtime.rs"

[[bin]]
name = "rill-pack"
path = "src/bin/rill-pack.rs"

[features]
# WASM handler support is on by default so that `cargo install rill-runtime`
# matches the official GitHub release binary behaviour. The core runtime
# stays WASM-free only when the user explicitly passes `--no-default-features`.
default = ["wasm"]
# Enables the sandboxed WASM InvokeHandler. Requires wasmtime, which raises the
# effective build-toolchain requirement; the core runtime stays WASM-free when
# this feature is off.
wasm = ["dep:wasmtime"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek.workspace = true
fs2.workspace = true
hex.workspace = true
rill-handler-api = { workspace = true }
rill-ml = { workspace = true, features = ["serde"] }
rill-runtime-protocol = { workspace = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true

# Pulley uses Cranelift to produce portable Pulley bytecode. OHOS enables
# Cranelift's all-architecture mode so that cross-compilation does not select a
# host-architecture helper object; existing platforms retain their established
# Cranelift backend configuration.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
wasmtime = { workspace = true, optional = true, features = ["cranelift"] }

[target.'cfg(target_env = "ohos")'.dependencies]
wasmtime = { workspace = true, optional = true, features = ["cranelift", "all-arch"] }

[dev-dependencies]
tempfile = "3"

# DecisionLedgerEntryV3 records the opaque action identifier used by the
# explicit opt-in Preview v3 protocol. Its old numeric selected_arm field was
# a placeholder, so this reviewed preview evolution is intentionally exempt
# from Stable ABI semver checks; all non-preview runtime API checks remain
# fail-closed.
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
struct_pub_field_missing = "allow"
