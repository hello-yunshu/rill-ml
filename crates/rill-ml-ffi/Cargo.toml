[package]
name = "rill-ml-ffi"
# Preview crate: stays at 0.x per release-plan.toml while Stable crates advance to 1.0.
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Preview C FFI for RillML — opaque-handle ABI for Android (JNI) and iOS (Swift) bindings, designed for future ABI stability."

[lib]
# staticlib: link into Android/iOS native applications. cdylib: dynamic use.
# rlib: enables the Rust integration tests in tests/ffi_abi.rs (same pattern
# as rill-ml-wasm and rill-ml-python).
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rill-ml = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
