[package]
name = "rill-ml-polars"
# Preview crate: stays at 0.x per release-plan.toml while Stable crates advance to 1.0.
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Polars DataFrame conversion helpers for RillML."

[dependencies]
rill-ml = { workspace = true }
polars = { workspace = true, features = ["dtype-full"] }
thiserror = { workspace = true }

[lib]
name = "rill_ml_polars"
path = "src/lib.rs"
