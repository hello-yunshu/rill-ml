[package]
name = "rillml-inspect"
# Preview crate: stays at 0.x per release-plan.toml while Stable crates advance to 1.0.
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Inspect RillML snapshots, model state, and version info."

[[bin]]
name = "rillml-inspect"
path = "src/main.rs"

[dependencies]
rill-ml = { workspace = true, features = ["serde"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
