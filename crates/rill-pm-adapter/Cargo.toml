[package]
name = "rill-pm-adapter"
# Preview crate: stays at 0.x per release-plan.toml while Stable crates advance to 1.0.
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "pm-rill-shadow v1 Unix-domain decision adapter for OpenWrt Performance Manager (advisory-only)."

[[bin]]
name = "rill-pm-adapter"
path = "src/main.rs"

[dependencies]
rill-ml = { workspace = true, features = ["serde"] }
clap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
