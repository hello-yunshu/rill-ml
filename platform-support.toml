# Machine-readable Stable platform support policy. This is a claim registry,
# not execution evidence. platform_consistency.py verifies that every claim
# has matching source-gate, release-index, and post-release paths; Actions
# generates the execution evidence separately.

[[target]]
triple = "x86_64-unknown-linux-gnu"
target_os = "linux"
target_arch = "x86_64"
target_libc = "gnu"
core_supported = true
runtime_supported = true
release_asset = true
runtime_features = "default"
source_gate = "native"
post_release_gate = "container"
asset_suffix = "linux-x86_64"

[[target]]
triple = "x86_64-unknown-linux-musl"
target_os = "linux"
target_arch = "x86_64"
target_libc = "musl"
runtime_backend = "cranelift"
pointer_width = 64
endianness = "little"
core_supported = true
runtime_supported = true
release_asset = true
runtime_features = "default"
source_gate = "native-musl"
post_release_gate = "container"
asset_suffix = "linux-x86_64-musl"

