# Machine-readable record of platform surfaces that have passed the Stable
# acceptance contract.  This file is an evidence registry, not a declaration:
# platform_consistency.py verifies that every row has a matching source gate,
# release-index entry, and post-release verifier.

[[target]]
triple = "x86_64-unknown-linux-gnu"
target_os = "linux"
target_arch = "x86_64"
target_libc = "gnu"
core_supported = true
runtime_supported = true
release_asset = true
runtime_features = "default"
source_gate = "native"
post_release_gate = "container"
asset_suffix = "linux-x86_64"

