[package]
name = "echo-handler"
version = "1.5.0"
edition = "2021"
publish = false
description = "Business-neutral echo handler for RillML Runtime — returns input as output."

[[bin]]
name = "echo-handler"
path = "src/main.rs"

[dependencies]
wit-bindgen = "0.29"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
